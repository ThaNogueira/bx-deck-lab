<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peça — BX Deck Lab</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="noise"></div>
  <header id="topbar"></header>
  <main id="app"><div class="empty-state">Carregando peça…</div></main>
  <script src="/js/shared.js"></script>
  <script>
    (async () => {
      BX.renderTopbar('/pecas');
      await BX.partTagReady();
      const slug = BX.pathPart(1);
      const app = document.getElementById('app');
      let data;
      try {
        data = await BX.api(`/api/parts/${encodeURIComponent(slug)}`);
      } catch (e) {
        app.innerHTML = `<div class="empty-state">${BX.esc(e.message)} — <a href="/pecas" style="color:var(--cyan)">voltar ao catálogo</a></div>`;
        return;
      }
      const { part, products } = data;
      document.title = `${part.displayName} — BX Deck Lab`;
      const aliases = (part.aliases || []).filter(Boolean);
      const gallery = [...new Set([part.imageUrl, ...(part.images || [])].filter(Boolean))];
      const s = part.stats || {};
      const hasStats = ['atk', 'def', 'sta', 'dash', 'burst'].some((k) => s[k] != null);

      const STAT_ROWS = [
        ['atk', 'Ataque', 'var(--red)'],
        ['def', 'Defesa', 'var(--green)'],
        ['sta', 'Stamina', 'var(--yellow)'],
        ['dash', 'X-Dash', 'var(--cyan)'],
        ['burst', 'Resist. Burst', 'var(--orange)'],
      ];
      const maxStat = Math.max(60, ...STAT_ROWS.map(([k]) => +s[k] || 0));
      const bars = STAT_ROWS.filter(([k]) => s[k] != null).map(([k, label, color]) => `
        <div class="score-row" style="grid-template-columns:90px minmax(0,1fr) 34px">
          <span>${label}</span>
          <div><i style="width:${Math.min(100, (s[k] / maxStat) * 100)}%;background:${color}"></i></div>
          <b>${s[k]}</b>
        </div>`).join('');

      const brandName = { TAKARA_TOMY: 'Takara Tomy', HASBRO: 'Hasbro', OTHER: '—' };
      const productsHtml = products.length
        ? `<div class="card-grid">${products.map((p) => `
            <div class="list-card">
              <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
                <h3 style="font-size:17px"><a href="/produto/${p.slug}" style="text-decoration:none;color:inherit">${BX.esc(p.name)}</a></h3>
                ${p.code ? `<span class="status-chip">${BX.esc(p.code)}</span>` : ''}
              </div>
              <div class="muted">${brandName[p.brand] || p.brand}${p.category ? ` • ${p.category.toLowerCase().replace('_', ' ')}` : ''}</div>
              <div class="list-card-foot">
                <a class="google-btn" target="_blank" rel="noopener" href="${BX.esc(p.googleUrl)}">🔎 Buscar no Google</a>
                <a href="/produto/${p.slug}" style="margin-left:auto;color:var(--cyan);font-size:11px;text-decoration:none">detalhes →</a>
              </div>
            </div>`).join('')}</div>`
        : `<div class="empty-state">Ainda não mapeamos os produtos desta peça — a sincronização do catálogo completa isso com o tempo.</div>`;

      app.innerHTML = `
        <div class="part-page-hero">
          <div class="part-gallery">
            <div class="part-main-img" id="mainImg">
              ${gallery.length ? `<img src="${BX.esc(gallery[0])}" alt="${BX.esc(part.displayName)}">` : `<span class="fallback" style="font:800 42px var(--display);color:#6f7787">${BX.esc((part.abbrev || part.displayName.slice(0, 2)).toUpperCase())}</span>`}
            </div>
            ${gallery.length > 1 ? `<div class="variant-thumbs">${gallery.map((url, i) => `
              <button class="variant-thumb ${i === 0 ? 'selected' : ''}" data-img="${BX.esc(url)}"><img loading="lazy" src="${BX.esc(url)}" alt=""></button>`).join('')}</div>` : ''}
          </div>
          <div>
            <p class="eyebrow">${BX.KIND_PT[part.kind]}${part.subKind === 'INTEGRATED' ? ' • RATCHET INTEGRADA' : part.subKind === 'RIB' ? ' • RATCHET-INTEGRATED BIT' : ''}</p>
            <h1 style="font:800 clamp(36px,4.5vw,58px)/.95 var(--display);text-transform:uppercase;margin:2px 0 10px">${BX.esc(part.displayName)}</h1>
            <div class="stat-chips" style="margin-bottom:12px">
              ${part.type ? `<span class="badge ${part.type.toLowerCase()}">${part.type}</span>` : ''}
              ${part.weightGrams != null ? `<span class="badge">⚖ ${part.weightGrams} g</span>` : ''}
              ${part.abbrev ? `<span class="badge">${BX.esc(part.abbrev)}</span>` : ''}
              ${part.banned ? '<span class="badge banned">Banida por padrão na WBO</span>' : ''}
            </div>
            ${aliases.length ? `<p style="color:var(--muted);font-size:12px;margin:0 0 12px">Também conhecida como: <b style="color:#c4cad3">${aliases.map(BX.esc).join(', ')}</b></p>` : ''}
            ${part.behavior || part.note ? `<p class="prose" style="font-size:12px;margin:0">${BX.esc(part.behavior || part.note)}</p>` : ''}
          </div>
          ${hasStats ? `
          <div class="panel-card part-stats-card">
            <p class="eyebrow">PERFORMANCE</p>
            <div class="radar-wrap">${BX.radar(s, { size: 230, max: maxStat })}</div>
            <div class="score-list" style="margin-top:8px">${bars}</div>
          </div>` : ''}
        </div>
        <div class="section-title-row" style="margin:26px 0 12px">
          <div><p class="eyebrow">ONDE ENCONTRAR</p><h2>Vem nesses produtos (${products.length})</h2></div>
          <small>Os botões abrem uma busca do Google — confira sempre o vendedor.</small>
        </div>
        ${productsHtml}`;

      document.querySelectorAll('.variant-thumb').forEach((btn) => btn.addEventListener('click', () => {
        document.querySelectorAll('.variant-thumb').forEach((b) => b.classList.toggle('selected', b === btn));
        document.getElementById('mainImg').innerHTML = `<img src="${btn.dataset.img}" alt="">`;
      }));
    })();
  </script>
</body>
</html>
