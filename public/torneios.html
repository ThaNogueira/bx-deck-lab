<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap"></noscript>
  <meta name="theme-color" content="#090a0f" />
  <title>Torneios — BX Deck Lab</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/design-system.css" />
</head>
<body>
  <div class="noise"></div>
  <header id="topbar"></header>
  <main>
    <div class="hero compact">
      <div>
        <p class="eyebrow">JOGUE PRESENCIAL</p>
        <h1>Torneios <em>abertos</em></h1>
        <p>Inscreva-se num torneio perto de você ou crie o seu — o site gera link de inscrição, QR Code e cartaz prontos.</p>
      </div>
      <div class="hero-actions"><a class="btn primary" href="/torneios/novo">+ Criar torneio</a></div>
    </div>
    <div class="page-toolbar">
      <input id="q" placeholder="Buscar por nome, loja ou cidade…" />
    </div>
    <div id="list"><div class="empty-state">Carregando torneios…</div></div>

  </main>
  <script src="/js/shared.js"></script>
  <script>
    (async () => {
      BX.renderTopbar('/torneios');
      let timer;
      async function load() {
        const q = document.getElementById('q').value;
        const { tournaments } = await BX.api(`/api/tournaments?query=${encodeURIComponent(q)}`);
        const card = (t) => `
            <a class="list-card" href="/torneio/${t.slug}">
              <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
                <h3>${BX.esc(t.name)}</h3>
                <span class="status-chip ${t.status}">${{ OPEN: 'inscrições abertas', RUNNING: `rodada ${t.currentRound}`, FINISHED: 'encerrado', CANCELED: 'cancelado' }[t.status]}</span>
              </div>
              <div class="muted">
                ${BX.ic('calendar', 14)} ${BX.dateFmt(t.startsAt, { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}<br>
                ${t.storeName ? `${BX.ic('store', 14)} ${BX.esc(t.storeName)}<br>` : ''}${t.address ? `${BX.ic('pin', 14)} ${BX.esc(t.address)}` : ''}
              </div>
              <div class="list-card-foot">
                <span>${t.playersCount} inscrito(s)</span>
                <span>${t.format === 'MD3' ? 'Melhor de 3' : 'Até 4 pontos'} • ${t.roundsPlanned} rodadas</span>
              </div>
            </a>`;
        const groups = [
          { status: 'RUNNING', title: 'Em andamento', note: 'Acompanhe as rodadas que estão acontecendo agora.', tone: 'running' },
          { status: 'OPEN', title: 'Inscrições abertas', note: 'Entre ou divulgue seu torneio.', tone: 'open' },
          { status: 'FINISHED', title: 'Torneios passados', note: 'Confira os resultados e a classificação final.', tone: 'finished' },
        ];
        document.getElementById('list').innerHTML = tournaments.length
          ? groups.map((g) => { const items = tournaments.filter((t) => t.status === g.status); return `
              <section class="tournament-section ${g.tone}">
                <div class="tournament-section-head"><div><p class="eyebrow">${g.title}</p><p>${g.note}</p></div><span>${items.length}</span></div>
                <div class="card-grid">${items.map(card).join('') || '<div class="tournament-section-empty">Nenhum torneio nesta seção.</div>'}</div>
              </section>`; }).join('')
          : '<div class="empty-state">Nenhum torneio encontrado.</div>';
      }
      load();
      document.getElementById('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 300); });

    })();
  </script>
</body>
</html>
