<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap"></noscript>
  <meta name="theme-color" content="#090a0f" />
  <title>Perfil — BX Deck Lab</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="noise"></div>
  <header id="topbar"></header>
  <main id="app"><div class="empty-state">Carregando perfil…</div></main>
  <script src="/js/shared.js"></script>
  <script>
    (async () => {
      BX.renderTopbar(null);
      await BX.partTagReady();
      const slug = BX.pathPart(1);
      const app = document.getElementById('app');
      let data;
      try {
        data = await BX.api(`/api/users/${encodeURIComponent(slug)}`);
      } catch (e) {
        app.innerHTML = `<div class="empty-state">${BX.esc(e.message)}</div>`;
        return;
      }
      const { user, favoritePart, collection, combos, decks } = data;
      const [postsRes, tourRes] = await Promise.all([
        BX.api(`/api/users/${encodeURIComponent(slug)}/posts`).catch(() => ({ posts: [] })),
        BX.api(`/api/users/${encodeURIComponent(slug)}/tournaments`).catch(() => ({ tournaments: [], titles: 0 })),
      ]);
      const userPosts = postsRes.posts || [];
      const userTours = tourRes.tournaments || [];
      const titles = tourRes.titles || 0;
      const T_STATUS = { OPEN: 'Inscrições', RUNNING: 'Em andamento', FINISHED: 'Encerrado' };
      const tourRow = (t) => `<a class="t-row ${t.champion ? 'champ' : ''}" href="/torneio/${BX.esc(t.slug)}">
        <span class="t-ic">${BX.icon(t.champion ? 'trophy' : t.status === 'RUNNING' ? 'live' : t.status === 'OPEN' ? 'calendar' : 'medal', 18)}</span>
        <span><b>${BX.esc(t.name)}</b><small>${BX.esc(t.storeName || '')}${t.storeName ? ' • ' : ''}${BX.dateFmt(t.startsAt, { day: '2-digit', month: 'short', year: 'numeric' })} • ${T_STATUS[t.status] || t.status}${t.dropped ? ' • desistiu' : ''}</small></span>
        <small>${t.champion ? 'Campeão' : t.placement ? `${t.placement}º${t.wins != null ? ` • ${t.wins} V` : ''}` : ''}</small>
      </a>`;
      document.title = `${user.name} — BX Deck Lab`;
      const me = await BX.me().catch(() => null);
      const idx = await BX.partTagReady();
      const isMe = me && me.id === user.id;
      // Coleção do visitante (pra destacar o que vocês dois têm) — só se estiver logado e não for o próprio perfil
      let mine = null;
      if (me && !isMe) {
        try { mine = (await BX.api('/api/me/collection')).items || []; } catch { mine = null; }
      }
      const mineExact = new Set((mine || []).filter((i) => i.qty > 0).map((i) => i.partId));
      const mineParents = new Set((mine || []).filter((i) => i.qty > 0).map((i) => idx.byId.get(i.partId)?.parentId || i.partId));
      const prog = BX.collectionProgress(collection, idx);

      const bannerInner = user.bannerUrl
        ? (/\.(mp4|webm)$/i.test(user.bannerUrl)
            ? `<video src="${BX.esc(user.bannerUrl)}" autoplay loop muted playsinline></video>`
            : `<img src="${BX.esc(user.bannerUrl)}" alt="">`)
        : '';
      const stickers = (user.cosmetics?.stickers || []);
      const forSale = collection.filter((i) => i.forSale);
      const shelf = collection.filter((i) => !i.forSale);

      /** Grade compacta da coleção, agrupada por categoria, com destaque do que o visitante também tem. */
      function pcolGrid(items) {
        const kindOf = (i) => i.part?.kind || 'BIT';
        const groups = BX.KIND_SORT.map((k) => ({ k, label: BX.KIND_PT[k], list: items.filter((i) => kindOf(i) === k) })).filter((g) => g.list.length);
        return groups.map((g) => {
          const common = mine ? g.list.filter((i) => mineParents.has(i.part?.parentId || i.partId)).length : 0;
          return `
          <details class="pcol-group">
            <summary class="pcol-group-head"><i class="pcol-caret">▸</i><span>${BX.esc(g.label)}</span><small>${g.list.length} item(ns)${common ? ` • <b>${common} em comum</b>` : ''}</small></summary>
            <div class="pcol-grid">${g.list
              .sort((a, b) => (a.part?.displayName || '').localeCompare(b.part?.displayName || '') || (a.part?.variantOrder || 0) - (b.part?.variantOrder || 0))
              .map((i) => {
                const p = i.part || {};
                const parentId = p.parentId || i.partId;
                const exact = mineExact.has(i.partId);
                const both = exact || mineParents.has(parentId);
                const color = p.variantLabel ? `<em class="pcol-color">${BX.esc(p.variantLabel)}</em>` : '';
                return `<a class="pcol-item ${both ? 'both' : ''} ${exact ? 'exact' : ''}" href="/peca/${BX.esc(p.slug || '')}" title="${BX.esc(p.displayName || '')}${p.variantLabel ? ' · ' + BX.esc(p.variantLabel) : ''}${both ? (exact ? ' — você tem a mesma cor' : ' — você também tem') : ''}">
                  ${BX.partThumb({ ...p, display: p.displayName, img: p.imageUrl }, 38)}
                  <span class="pcol-name"><b>${BX.esc(p.displayName || '?')}</b>${color}</span>
                  ${i.qty > 1 ? `<span class="pcol-qty">×${i.qty}</span>` : ''}
                  ${both ? `<span class="pcol-check" title="${exact ? 'Mesma cor' : 'Você também tem'}">${BX.ic('check', 14)}</span>` : ''}
                </a>`;
              }).join('')}</div>
          </details>`;
        }).join('');
      }

      const saleCard = (i) => `
        <div class="list-card">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
            ${BX.partTag({ ...i.part, display: i.part?.displayName, img: i.part?.imageUrl }, { size: 34 })}
            <span class="sale-tag">à venda</span>
          </div>
          <div class="muted">${i.qty > 1 ? `${i.qty} unidades • ` : ''}${BX.esc(i.condition || 'condição não informada')}</div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <span class="price">${i.priceCents != null ? BX.money(i.priceCents) : 'a combinar'}</span>
            ${i.whatsappUrl ? `<a class="wa-btn" target="_blank" rel="noopener" href="${BX.esc(i.whatsappUrl)}">${BX.ic('whatsapp', 14)} Tenho interesse</a>` : ''}
          </div>
        </div>`;

      app.innerHTML = `
        <div class="profile-banner">${bannerInner}</div>
        <div class="profile-head">
          ${BX.avatarHtml(user, { size: 92 })}
          <div class="profile-id">
            <h1>${BX.esc(user.name)} ${user.role !== 'USER' ? `<span class="role-chip ${user.role}">${user.role}</span>` : ''}</h1>
            <p>@${BX.esc(user.slug)}${user.bio ? ` — ${BX.esc(user.bio)}` : ''}</p>
            ${stickers.length ? `<div class="sticker-row" style="margin-top:8px">${stickers.map((s) => `<span class="sticker" title="${BX.esc(s.name)}">${s.imageUrl ? `<img src="${BX.esc(s.imageUrl)}">` : BX.esc(s.styleKey || '') || BX.icon('star', 14)}</span>`).join('')}</div>` : ''}
          </div>
          <div class="profile-head-actions">
            ${me && me.id === user.id ? '<a class="btn secondary" href="/perfil">Editar meu perfil</a>' : `<button class="btn ghost" id="reportBtn">${BX.icon('flag', 15)}Denunciar</button>`}
          </div>
        </div>
        <div class="profile-grid">
          <div style="display:flex;flex-direction:column;gap:16px">
            ${forSale.length ? `
              <div class="panel-card">
                <div class="section-title-row" style="margin-bottom:12px"><div><p class="eyebrow">VITRINE</p><h2>Peças à venda</h2></div></div>
                <div class="card-grid">${forSale.map(saleCard).join('')}</div>
              </div>` : ''}
            ${combos.length ? `
              <div class="panel-card">
                <div class="section-title-row" style="margin-bottom:12px"><div><p class="eyebrow">COMBOS</p><h2>Combos montados</h2></div></div>
                <div class="card-grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${combos.map((c) => `
                  <div class="list-card">
                    <div style="display:flex;justify-content:space-between;gap:8px"><h3 style="font-size:17px">${BX.esc(c.title)}</h3>${c.forSale ? '<span class="sale-tag">à venda</span>' : ''}</div>
                    ${BX.beyVisual(c.parts)}
                    ${c.description ? `<p class="muted" style="margin:0">${BX.esc(c.description)}</p>` : ''}
                    ${c.forSale ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                      <span class="price">${c.priceCents != null ? BX.money(c.priceCents) : 'a combinar'}</span>
                      ${c.whatsappUrl ? `<a class="wa-btn" target="_blank" rel="noopener" href="${BX.esc(c.whatsappUrl)}">${BX.icon('whatsapp', 14)} Tenho interesse</a>` : ''}
                    </div>` : ''}
                  </div>`).join('')}</div>
              </div>` : ''}
            <div class="panel-card">
              <div class="section-title-row" style="margin-bottom:8px">
                <div><p class="eyebrow">COLEÇÃO</p><h2>Peças da coleção</h2></div>
                <small>${shelf.reduce((n, i) => n + i.qty, 0)} unidade(s) • ${collection.length} item(ns)</small>
              </div>
              ${collection.length ? BX.progressBarHtml(prog, { label: isMe ? 'do Beyblade X na sua coleção' : 'do Beyblade X' }) : ''}
              ${mine && shelf.length ? `<p class="pcol-legend"><i class="pcol-dot both"></i> vocês dois têm ${shelf.filter((i) => mineParents.has(i.part?.parentId || i.partId)).length} destas peças <i class="pcol-dot exact" style="margin-left:10px"></i> mesma cor</p>` : ''}
              ${me && !isMe && mine && !mine.length ? '<p class="pcol-legend muted">Adicione peças em <a href="/#collection">Minha coleção</a> para ver o que vocês dois têm.</p>' : ''}
              ${shelf.length ? pcolGrid(shelf) : '<div class="empty-state">Coleção não publicada.</div>'}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:16px">
            ${favoritePart ? `
              <div class="panel-card">
                <p class="eyebrow">BEY FAVORITA</p>
                <div class="fav-bey-card" style="margin-top:10px">
                  ${BX.partThumb({ ...favoritePart, img: favoritePart.imageUrl }, 92)}
                  <div>
                    <strong style="font:800 22px var(--display);text-transform:uppercase"><a href="/peca/${favoritePart.slug}" style="text-decoration:none;color:inherit">${BX.esc(favoritePart.displayName)}</a></strong>
                    ${favoritePart.type ? `<div style="margin-top:5px"><span class="badge ${favoritePart.type.toLowerCase()}">${favoritePart.type}</span></div>` : ''}
                  </div>
                </div>
              </div>` : ''}
            <div class="panel-card">
              <p class="eyebrow">DECKS PUBLICADOS</p>
              <div style="margin-top:10px">
                ${decks.length
                  ? decks.map((d) => `<div class="bey-line deck-line">${d.beys ? BX.deckPreview(d.beys, { u: 26 }) : ''}<span style="flex:1"><a href="/deck/${d.slug}" style="color:white;text-decoration:none;font-weight:700">${BX.esc(d.title)}</a></span><small style="color:var(--muted)">${BX.dateFmt(d.createdAt, { day: '2-digit', month: 'short' })}</small></div>`).join('')
                  : '<div class="empty-state">Nenhum deck publicado.</div>'}
              </div>
            </div>
            <div class="panel-card">
              <div class="section-title-row" style="margin-bottom:8px"><div><p class="eyebrow">TORNEIOS</p><h2 style="font-size:22px">Participações</h2></div>${titles ? `<span class="title-count">${BX.icon('trophy', 14)} ${titles} título${titles === 1 ? '' : 's'}</span>` : ''}</div>
              <div style="display:grid;gap:6px">${userTours.length ? userTours.slice(0, 12).map(tourRow).join('') : '<div class="empty-state">Ainda não participou de torneios.</div>'}</div>
            </div>
            <div class="panel-card">
              <div class="section-title-row" style="margin-bottom:8px"><div><p class="eyebrow">COMUNIDADE</p><h2 style="font-size:22px">Posts</h2></div></div>
              <div class="profile-posts">${userPosts.length ? userPosts.slice(0, 10).map((p) => `<a class="mini-post" href="/comunidade/p/${p.id}"><span><b>${BX.esc(p.title)}</b><small>${BX.esc(p.tagLabel)} • ${BX.dateFmt(p.createdAt, { day: '2-digit', month: 'short' })}</small></span><small>${BX.icon('comment', 12)} ${p.commentCount} · ${BX.icon('fire', 12)} ${p.reactions?.total ?? 0}</small></a>`).join('') : '<div class="empty-state">Nenhum post ainda.</div>'}</div>
            </div>
            <div class="panel-card">
              <p class="eyebrow">DESDE</p>
              <p style="color:var(--muted);font-size:12px;margin:8px 0 0">No BX Deck Lab desde ${BX.dateFmt(user.createdAt, { day: '2-digit', month: 'long', year: 'numeric' })}.</p>
            </div>
          </div>
        </div>`;

      document.getElementById('reportBtn')?.addEventListener('click', () => BX.report('USER', user.id, 'este perfil'));
    })();
  </script>
</body>
</html>
