<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inscrição — BX Deck Lab</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="noise"></div>
  <header id="topbar"></header>
  <main id="app">
    <div class="big-join"><p class="eyebrow">CARREGANDO…</p></div>
  </main>
  <script src="/js/shared.js"></script>
  <script>
    (async () => {
      BX.renderTopbar(null);
      const slug = BX.pathPart(1);
      const app = document.getElementById('app');
      let data;
      try {
        data = await BX.api(`/api/tournaments/${encodeURIComponent(slug)}`);
      } catch (e) {
        app.innerHTML = `<div class="big-join"><h1>Ops!</h1><p style="color:var(--muted)">${BX.esc(e.message)}</p></div>`;
        return;
      }
      const t = data.tournament;
      document.title = `Inscrição: ${t.name} — BX Deck Lab`;
      const me = await BX.me().catch(() => null);
      const joined = !!data.me;

      function screen(inner) {
        app.innerHTML = `<div class="big-join"><div>
          <p class="eyebrow">${BX.dateFmt(t.startsAt, { weekday: 'long', day: '2-digit', month: 'long', hour: '2-digit', minute: '2-digit' })}${t.storeName ? ` • ${BX.esc(t.storeName)}` : ''}</p>
          <h1>${BX.esc(t.name)}</h1>
          ${t.address ? `<p style="color:var(--muted)">📍 ${BX.esc(t.address)}</p>` : ''}
          ${inner}
        </div></div>`;
      }

      if (t.status !== 'OPEN') {
        screen(`<p style="color:var(--muted);margin-top:14px">As inscrições deste torneio estão fechadas.</p>
          <a class="btn secondary" style="margin-top:14px;display:inline-block;text-decoration:none" href="/torneio/${t.slug}">Ver o torneio</a>`);
        return;
      }
      if (joined) {
        screen(`<p style="color:var(--green);font-weight:800;margin-top:14px">✔ Você já está inscrito!</p>
          <a class="btn primary" style="margin-top:14px;display:inline-block;text-decoration:none" href="/torneio/${t.slug}">Ir para o torneio</a>`);
        return;
      }
      if (!me) {
        screen(`<p style="color:var(--muted);margin-top:10px">Para se inscrever, entre com sua conta (leva 10 segundos):</p>
          <button class="btn-huge btn" id="loginBtn" style="margin-top:22px">ENTRAR PARA SE INSCREVER</button>`);
        document.getElementById('loginBtn').addEventListener('click', () => BX.requireLogin(`/t/${t.slug}`));
        return;
      }
      screen(`<button class="btn-huge" id="joinBtn">ENTRAR NO TORNEIO</button>
        <p style="color:var(--muted);margin-top:16px;font-size:12px">${t.playersCount} jogador(es) já inscritos • ${t.format === 'MD3' ? 'melhor de 3' : 'até 4 pontos'}</p>`);
      document.getElementById('joinBtn').addEventListener('click', async () => {
        try {
          await BX.api(`/api/tournaments/${t.slug}/join`, { method: 'POST' });
          screen(`<p style="color:var(--green);font:800 30px var(--display);text-transform:uppercase;margin-top:18px">✔ Inscrição confirmada!</p>
            <a class="btn primary" style="margin-top:14px;display:inline-block;text-decoration:none" href="/torneio/${t.slug}">Ir para o torneio</a>`);
        } catch (e) { BX.toast(e.message); }
      });
    })();
  </script>
</body>
</html>
