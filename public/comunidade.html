<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap"></noscript>
  <meta name="theme-color" content="#090a0f" />
  <title>Comunidade — BX Deck Lab</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="noise"></div>
  <header id="topbar"></header>
  <main id="app"><div class="com-layout"><section id="skel"></section></div></main>
  <script src="/js/shared.js"></script>
  <script src="/js/post-card.js"></script>
  <script>
    (async () => {
      BX.renderTopbar('/comunidade');
      const app = document.getElementById('app');
      document.getElementById('skel').innerHTML = BXPost.skeleton(3);
      const { esc, icon } = BX;
      const meta = await BXPost.ready();
      const me = BXPost.me;
      const TAGS = meta.tags;
      const USER_TAGS = Object.keys(TAGS).filter((k) => !TAGS[k].auto);
      const path = location.pathname;
      const postId = path.startsWith('/comunidade/p/') ? BX.pathPart(2) : null;
      const isNew = path === '/comunidade/novo';

      const tagChipBtn = (k, active) => `<button type="button" class="tag-chip sm ${k.toLowerCase()} ${active ? 'active' : ''}" data-tag="${k}">${icon(TAGS[k].icon, 13)}${esc(TAGS[k].label)}</button>`;
      const sideHtml = () => `<aside class="com-side">
          <div class="panel-card com-about">
            <p class="eyebrow">COMUNIDADE BX</p>
            <h3>Clipes, resultados, dúvidas e vendas</h3>
            <p>O feed da galera do Beyblade X. Posts competitivos (deck, resultado, clipe, campeão) também aparecem na <a href="/">home</a>.</p>
            <a class="btn primary" href="/comunidade/novo" style="text-decoration:none;width:100%;justify-content:center">${icon('plus', 15)}Criar post</a>
          </div>
          <div class="panel-card"><h3>Tags</h3><div class="tag-chips">${Object.keys(TAGS).map((k) => `<a class="tag-chip sm ${k.toLowerCase()}" href="/comunidade?tag=${k}">${icon(TAGS[k].icon, 13)}${esc(TAGS[k].label)}</a>`).join('')}</div></div>
          <div class="panel-card"><h3>Regras da casa</h3><ol class="com-rules">
            <li>Respeito sempre. Sem ofensa, sem spam.</li>
            <li>Venda/troca só com a tag certa, preço e estado claros.</li>
            <li>Clipe é seu ou com crédito.</li>
            <li>Imagens passam por triagem automática restritiva; vídeos por aprovação manual.</li>
            <li>Conteúdo impróprio é excluído e a conta pode ser suspensa.</li>
          </ol></div>
        </aside>`;

      // =====================================================================
      // FEED
      // =====================================================================
      async function renderFeed() {
        const params = new URLSearchParams(location.search);
        let sort = ['recent', 'top', 'hot'].includes(params.get('sort')) ? params.get('sort') : 'hot';
        let tag = TAGS[params.get('tag')] ? params.get('tag') : '';
        let offset = 0, loading = false, feed = [];
        const syncUrl = () => { const p = new URLSearchParams(); if (sort !== 'hot') p.set('sort', sort); if (tag) p.set('tag', tag); history.replaceState(null, '', '/comunidade' + (p.toString() ? '?' + p : '')); };
        const SORTS = [['hot', 'bolt', 'Em alta'], ['recent', 'clock', 'Recentes'], ['top', 'fire', 'Mais curtidos']];

        app.innerHTML = `<div class="com-layout">
          <section class="com-main">
            <div class="create-bar">
              ${me ? BX.avatarHtml(me, { size: 38 }) : `<span class="pc-avatar sys">${icon('profile', 18)}</span>`}
              <a class="create-input" href="/comunidade/novo">Criar post…</a>
              <a class="create-ic" href="/comunidade/novo?tipo=midia" title="Imagem ou vídeo" aria-label="Imagem ou vídeo">${icon('image', 18)}</a>
              <a class="create-ic" href="/comunidade/novo?tipo=link" title="Vídeo do YouTube" aria-label="Vídeo do YouTube">${icon('video', 18)}</a>
              <a class="create-ic" href="/comunidade/novo?tipo=enquete" title="Enquete" aria-label="Enquete">${icon('poll', 18)}</a>
            </div>
            <div class="feed-bar">
              <div class="com-sort" id="sortBar">${SORTS.map(([k, i, l]) => `<button type="button" data-sort="${k}" class="${sort === k ? 'active' : ''}">${icon(i, 14)}${l}</button>`).join('')}</div>
              <div class="tag-scroll" id="tagBar"><button type="button" class="tag-chip sm ${tag ? '' : 'active'}" data-tag="">${icon('feed', 13)}Tudo</button>${USER_TAGS.concat(['DECK']).map((k) => tagChipBtn(k, tag === k)).join('')}</div>
            </div>
            <div class="post-list" id="postList">${BXPost.skeleton(3)}</div>
            <div class="feed-more" id="moreWrap"></div>
            <div id="sentinel" style="height:1px"></div>
          </section>
          ${sideHtml()}
        </div>`;
        const list = document.getElementById('postList');
        BXPost.bind(app, { getPost: (id) => feed.find((p) => p.id === id), onDeleted: (id, card) => { feed = feed.filter((p) => p.id !== id); card?.remove(); } });

        const moreBtn = () => { document.getElementById('moreWrap').innerHTML = offset != null ? `<button class="btn secondary" id="loadMore">Carregar mais</button>` : (feed.length ? '<small class="muted">Você chegou ao fim.</small>' : ''); };
        async function load(reset) {
          if (loading) return; loading = true;
          if (reset) { offset = 0; feed = []; list.innerHTML = BXPost.skeleton(3); }
          try {
            const j = await BX.api(`/api/posts?sort=${sort}&tag=${tag}&offset=${offset}&limit=12`);
            if (reset) list.innerHTML = '';
            feed.push(...j.posts); offset = j.nextOffset;
            list.insertAdjacentHTML('beforeend', j.posts.map((p) => BXPost.card(p)).join(''));
            if (!feed.length) list.innerHTML = `<div class="empty-state">Nenhum post ${tag ? `com a tag ${esc(TAGS[tag].label)}` : ''} ainda. <a href="/comunidade/novo" style="color:var(--cyan)">Seja a primeira pessoa a postar.</a></div>`;
            moreBtn();
          } catch (e) { list.innerHTML = `<div class="empty-state">${esc(e.message)}</div>`; }
          loading = false;
        }
        app.addEventListener('click', (e) => {
          const sb = e.target.closest('[data-sort]'); if (sb) { sort = sb.dataset.sort; document.querySelectorAll('[data-sort]').forEach((b) => b.classList.toggle('active', b === sb)); syncUrl(); load(true); return; }
          const tb = e.target.closest('#tagBar [data-tag]'); if (tb) { tag = tb.dataset.tag; document.querySelectorAll('#tagBar [data-tag]').forEach((b) => b.classList.toggle('active', b === tb)); syncUrl(); load(true); return; }
          if (e.target.closest('#loadMore')) load(false);
        });
        new IntersectionObserver((en) => { if (en.some((x) => x.isIntersecting) && offset != null && feed.length) load(false); }, { rootMargin: '600px' }).observe(document.getElementById('sentinel'));
        load(true);
      }

      // =====================================================================
      // COMPOSER (tela inteira)
      // =====================================================================
      function renderComposer() {
        if (!me) { BX.requireLogin('/comunidade/novo'); return; }
        const params = new URLSearchParams(location.search);
        const TYPES = [['texto', 'edit', 'Texto'], ['midia', 'image', 'Imagens e vídeo'], ['link', 'video', 'Link do YouTube'], ['enquete', 'poll', 'Enquete'], ['venda', 'sale', 'Venda / troca']];
        let type = TYPES.some(([k]) => k === params.get('tipo')) ? params.get('tipo') : 'texto';
        let chosenTag = TAGS[params.get('tag')] && !TAGS[params.get('tag')].auto ? params.get('tag') : (type === 'venda' ? 'SALE' : '');
        let files = [];
        document.title = 'Criar post — Comunidade BX Deck Lab';
        app.innerHTML = `<div class="composer-page">
          <header class="composer-head">
            <a class="btn ghost" href="/comunidade" style="text-decoration:none">${icon('back', 14)}Comunidade</a>
            <h1>Criar post</h1>
            <span class="muted">postando como <b>${esc(me.name)}</b></span>
          </header>
          <div class="composer-grid">
            <form class="composer-form" id="cForm" novalidate>
              <div class="composer-types" role="tablist">${TYPES.map(([k, i, l]) => `<button type="button" role="tab" data-type="${k}" class="${type === k ? 'active' : ''}" aria-selected="${type === k}">${icon(i, 15)}<span>${l}</span></button>`).join('')}</div>

              <section class="cf-block">
                <label class="cf-label">Tag <small>obrigatória — define onde o post aparece</small></label>
                <div class="tag-chips" id="cTags">${USER_TAGS.map((k) => tagChipBtn(k, k === chosenTag)).join('')}</div>
                <small class="cf-hint" id="tagHint"></small>
              </section>

              <section class="cf-block">
                <div class="cf-field"><input id="cTitle" maxlength="140" placeholder="Título*" autocomplete="off" required /><span class="cf-count"><span id="titleCount">0</span>/140</span></div>
              </section>

              <section class="cf-block" data-for="texto midia link enquete venda">
                <div class="cf-field"><textarea id="cBody" maxlength="5000" rows="6" placeholder="Texto (opcional). Conta a história, marca alguém com @usuario, cola links…"></textarea><span class="cf-count"><span id="bodyCount">0</span>/5000</span></div>
              </section>

              <section class="cf-block" data-for="midia" hidden>
                <label class="cf-label">Imagens, GIF ou vídeo curto <small>até 6 arquivos · 40 MB cada</small></label>
                <div class="file-drop" id="cDrop" tabindex="0">${icon('upload', 24)}<span>Arraste aqui ou clique para escolher</span><small>PNG, JPG, WebP, GIF, MP4, WebM</small></div>
                <input id="cFiles" type="file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm" multiple hidden />
                <div class="media-preview" id="cPreview"></div>
                <small class="cf-hint">${icon('shield', 12, 'inline')} Imagens passam por triagem automática restritiva. Vídeos ficam pendentes até um moderador aprovar.</small>
              </section>

              <section class="cf-block" data-for="link" hidden>
                <label class="cf-label">Link do YouTube</label>
                <div class="cf-field">${icon('video', 16)}<input id="cEmbed" inputmode="url" placeholder="https://youtube.com/watch?v=…" /></div>
                <div id="embedPreview"></div>
              </section>

              <section class="cf-block" data-for="enquete" hidden>
                <label class="cf-label">Opções da enquete <small>2 a 8</small></label>
                <div class="poll-builder"><div id="cPollOpts"><div class="row"><input placeholder="Opção 1" maxlength="80"></div><div class="row"><input placeholder="Opção 2" maxlength="80"></div></div>
                <div class="composer-row"><button type="button" class="btn ghost" id="cPollAdd">${icon('plus', 14)}Opção</button><label class="cf-inline">Duração <select id="cPollHours" aria-label="Duração"><option value="24">1 dia</option><option value="72" selected>3 dias</option><option value="168">7 dias</option><option value="336">14 dias</option></select></label></div></div>
              </section>

              <section class="cf-block" data-for="venda" hidden>
                <label class="cf-label">Dados da venda / troca</label>
                <div class="sale-fields">
                  <div><label>Preço (R$)</label><input id="cPrice" inputmode="decimal" placeholder="ex.: 120,00" /></div>
                  <div><label>Estado</label><select id="cCond">${meta.saleConditions.map((c) => `<option>${esc(c)}</option>`).join('')}</select></div>
                  <div class="full"><label>Contato (WhatsApp com DDD, ou @)</label><input id="cContact" value="${esc(me.whatsapp || '')}" placeholder="11999998888" /></div>
                  <label class="confirm-remember full" style="margin:0"><input type="checkbox" id="cTrade"> <span>Aceito troca</span></label>
                </div>
              </section>

              <footer class="composer-foot">
                <small class="muted" id="cStatus"></small>
                <a class="btn secondary" href="/comunidade" style="text-decoration:none">Cancelar</a>
                <button type="submit" class="btn primary" id="cSend">${icon('publish', 15)}Publicar</button>
              </footer>
            </form>
            <aside class="composer-side">
              <div class="panel-card"><p class="eyebrow">PRÉVIA</p><div id="cPreviewCard" class="post-list" style="margin-top:10px"></div></div>
              <div class="panel-card"><h3>Dicas para um bom post</h3><ul class="com-rules">
                <li>Título direto: o que é e de onde (ex.: "Final regional SP: burst no último segundo").</li>
                <li>Clipe? Use a tag <b>Clipe de Partida</b> e o link do YouTube ou um vídeo curto.</li>
                <li>Venda/troca: preço, estado e contato. Sem isso o post é removido.</li>
                <li>Deck montado no builder? Compartilhe pelo próprio deck: ele vira um card com "Copiar deck".</li>
              </ul></div>
            </aside>
          </div>
        </div>`;
        const q = (s) => app.querySelector(s);
        const setType = (t) => {
          type = t;
          app.querySelectorAll('[data-type]').forEach((b) => { b.classList.toggle('active', b.dataset.type === t); b.setAttribute('aria-selected', b.dataset.type === t); });
          app.querySelectorAll('[data-for]').forEach((s) => { s.hidden = !s.dataset.for.split(' ').includes(t) && !(t === 'texto' && s.dataset.for.includes('texto')); });
          if (t === 'venda' && chosenTag !== 'SALE') { chosenTag = 'SALE'; syncTag(); }
          if (t !== 'venda' && chosenTag === 'SALE') { chosenTag = ''; syncTag(); }
          preview();
        };
        const syncTag = () => {
          q('#cTags').querySelectorAll('[data-tag]').forEach((b) => b.classList.toggle('active', b.dataset.tag === chosenTag));
          q('#tagHint').textContent = chosenTag ? ({ CLIP: 'Aparece na home. Coloque o vídeo (YouTube ou arquivo).', RESULT: 'Aparece na home. Conte colocação, loja e deck.', CHAMPION: 'Aparece na home. Foto do troféu vale muito.', SALE: 'Só na comunidade. Preencha preço, estado e contato.', CHANNEL: 'Só na comunidade. Nada de spam repetido.', UNBOXING: 'Só na comunidade. Mostre as peças!', HELP: 'Só na comunidade. Seja específico na dúvida.', OFFTOPIC: 'Só na comunidade.' })[chosenTag] || '' : 'Escolha uma tag.';
          if (chosenTag === 'SALE' && type !== 'venda') setType('venda');
        };
        const draft = () => ({
          id: 'preview', kind: 'USER', tag: chosenTag || 'OFFTOPIC', title: q('#cTitle').value.trim() || 'Seu título aparece aqui', body: q('#cBody').value.trim(),
          media: [...files.map((f) => ({ type: f.type.startsWith('video/') ? 'video' : f.type === 'image/gif' ? 'gif' : 'image', url: f._url || (f._url = URL.createObjectURL(f)) })), ...(ytIdOf(q('#cEmbed').value) ? [{ type: 'embed', id: ytIdOf(q('#cEmbed').value) }] : [])],
          poll: type === 'enquete' ? { total: 0, ended: false, options: [...q('#cPollOpts').querySelectorAll('input')].map((i, n) => ({ id: String(n), text: i.value || i.placeholder, votes: 0, pct: 0 })) } : null,
          sale: chosenTag === 'SALE' ? { priceCents: Math.round(parseFloat(q('#cPrice').value.replace(',', '.')) * 100) || null, condition: q('#cCond').value, trade: q('#cTrade').checked, contact: q('#cContact').value, whatsappUrl: null } : null,
          status: 'VISIBLE', reactions: { counts: {}, total: 0, mine: null }, commentCount: 0, createdAt: new Date().toISOString(), author: me, mine: false, url: location.origin + '/comunidade',
        });
        const ytIdOf = (url) => { const m = String(url || '').match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{6,})/); return m ? m[1] : null; };
        let pt = 0;
        const preview = () => { clearTimeout(pt); pt = setTimeout(() => { q('#cPreviewCard').innerHTML = BXPost.card(draft()); q('#cPreviewCard').querySelectorAll('.pc-menu-wrap,.pc-foot').forEach((x) => x.remove()); }, 120); };
        const renderFiles = () => {
          q('#cPreview').innerHTML = files.map((f, i) => `<div class="mp">${f.type.startsWith('video/') ? `<video src="${f._url || (f._url = URL.createObjectURL(f))}" muted></video>` : `<img src="${f._url || (f._url = URL.createObjectURL(f))}" alt="">`}<button type="button" data-rm="${i}" aria-label="Remover">${icon('x', 12)}</button><small>${f.type.startsWith('video/') ? 'vídeo · aprovação manual' : (f.size / 1048576).toFixed(1) + ' MB'}</small></div>`).join('');
          preview();
        };
        const addFiles = (list) => { const ok = [...list].filter((f) => f.size <= 40 * 1048576); if (ok.length < list.length) BX.toast('Arquivos acima de 40 MB foram ignorados.'); files = [...files, ...ok].slice(0, 6); renderFiles(); if (files.length && type !== 'midia') setType('midia'); };

        app.addEventListener('click', (e) => {
          const tb = e.target.closest('[data-type]'); if (tb) return setType(tb.dataset.type);
          const tg = e.target.closest('#cTags [data-tag]'); if (tg) { chosenTag = tg.dataset.tag; syncTag(); preview(); return; }
          const rm = e.target.closest('[data-rm]'); if (rm) { files.splice(+rm.dataset.rm, 1); renderFiles(); return; }
          if (e.target.closest('#cDrop')) return q('#cFiles').click();
          if (e.target.closest('#cPollAdd')) { const n = q('#cPollOpts').children.length; if (n >= 8) return; q('#cPollOpts').insertAdjacentHTML('beforeend', `<div class="row"><input placeholder="Opção ${n + 1}" maxlength="80"></div>`); preview(); }
        });
        q('#cFiles').onchange = (e) => addFiles(e.target.files);
        q('#cDrop').addEventListener('dragover', (e) => { e.preventDefault(); q('#cDrop').classList.add('over'); });
        q('#cDrop').addEventListener('dragleave', () => q('#cDrop').classList.remove('over'));
        q('#cDrop').addEventListener('drop', (e) => { e.preventDefault(); q('#cDrop').classList.remove('over'); addFiles(e.dataTransfer.files); });
        q('#cDrop').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); q('#cFiles').click(); } });
        app.addEventListener('input', (e) => {
          if (e.target.id === 'cTitle') q('#titleCount').textContent = e.target.value.length;
          if (e.target.id === 'cBody') { q('#bodyCount').textContent = e.target.value.length; e.target.style.height = 'auto'; e.target.style.height = Math.min(600, e.target.scrollHeight) + 'px'; }
          if (e.target.id === 'cEmbed') { const id = ytIdOf(e.target.value); q('#embedPreview').innerHTML = id ? `<div class="pc-media" style="margin-top:8px"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" style="max-height:220px"></div>` : (e.target.value.trim() ? '<small class="cf-hint warn">Só links do YouTube são aceitos.</small>' : ''); }
          preview();
        });
        // Rascunho: não perder o texto ao trocar de aba/recarregar
        try { const d = JSON.parse(localStorage.getItem('bx_post_draft') || 'null'); if (d && !q('#cTitle').value) { q('#cTitle').value = d.title || ''; q('#cBody').value = d.body || ''; if (d.tag && TAGS[d.tag]) chosenTag = d.tag; q('#titleCount').textContent = q('#cTitle').value.length; q('#bodyCount').textContent = q('#cBody').value.length; } } catch {}
        setInterval(() => { try { localStorage.setItem('bx_post_draft', JSON.stringify({ title: q('#cTitle')?.value, body: q('#cBody')?.value, tag: chosenTag })); } catch {} }, 3000);
        setType(type); syncTag(); preview();

        q('#cForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const title = q('#cTitle').value.trim();
          if (!chosenTag) { BX.toast('Escolha uma tag.'); q('#cTags').scrollIntoView({ block: 'center' }); return; }
          if (title.length < 3) { BX.toast('Dê um título (mínimo 3 letras).'); q('#cTitle').focus(); return; }
          const fd = new FormData();
          fd.append('tag', chosenTag); fd.append('title', title); fd.append('body', q('#cBody').value.trim());
          if (type === 'link') fd.append('embedUrl', q('#cEmbed').value.trim());
          if (type === 'enquete') fd.append('poll', JSON.stringify({ options: [...q('#cPollOpts').querySelectorAll('input')].map((i) => i.value), hours: q('#cPollHours').value }));
          if (chosenTag === 'SALE') fd.append('sale', JSON.stringify({ price: q('#cPrice').value, condition: q('#cCond').value, contact: q('#cContact').value, trade: q('#cTrade').checked }));
          if (type === 'midia') files.forEach((f) => fd.append('media', f));
          const btn = q('#cSend'); btn.disabled = true; q('#cStatus').textContent = files.length ? 'Enviando mídia…' : 'Publicando…';
          try {
            const res = await fetch('/api/posts', { method: 'POST', body: fd });
            const j = await res.json();
            if (!res.ok) throw new Error(j.error || 'Não deu para publicar.');
            try { localStorage.removeItem('bx_post_draft'); } catch {}
            BX.toast(j.post.status === 'SCANNING' ? 'Post enviado! Analisando a mídia…' : 'Post publicado!');
            location.href = `/comunidade/p/${j.post.id}`;
          } catch (er) { BX.toast(er.message); btn.disabled = false; q('#cStatus').textContent = ''; }
        });
      }

      // =====================================================================
      // PÁGINA DO POST + COMENTÁRIOS
      // =====================================================================
      let current = null;
      function commentHtml(c, depth) {
        const removed = c.status !== 'VISIBLE';
        return `<div class="cm ${depth ? 'reply' : ''} ${removed ? 'removed' : ''}" id="c-${c.id}" data-cid="${c.id}">
          ${removed ? '<span class="avatar" style="width:32px;height:32px"><b>·</b></span>' : BX.avatarHtml(c.author, { size: 32 })}
          <div>
            <div class="cm-head">${removed ? '<small>comentário removido</small>' : `<a href="/u/${esc(c.author.slug)}">${esc(c.author.name)}</a><small>${BXPost.timeAgo(c.createdAt)}</small>`}</div>
            <p class="cm-body">${removed ? '—' : BXPost.linkify(c.body)}</p>
            ${removed ? '' : `<div class="cm-actions">${BXPost.reactionsHtml(c, 'COMMENT')}<button type="button" class="act-btn" data-reply="${c.id}" data-to="${esc(c.author.slug)}">${icon('reply', 13)}Responder</button><button type="button" class="act-btn" data-report-c="${c.id}" title="Denunciar">${icon('flag', 13)}</button>${(c.mine || current.post.canModerate) ? `<button type="button" class="act-btn" data-delc="${c.id}" title="Excluir">${icon('trash', 13)}</button>` : ''}</div>`}
          </div>
        </div>`;
      }
      function commentsTree(list) {
        const kids = new Map();
        list.forEach((c) => { const k = c.parentId || ''; if (!kids.has(k)) kids.set(k, []); kids.get(k).push(c); });
        const walk = (pid, depth) => (kids.get(pid) || []).map((c) => commentHtml(c, depth) + walk(c.id, Math.min(depth + 1, 1))).join('');
        return walk('', 0);
      }
      const commentForm = (parentId = '', to = '') => !me
        ? `<div class="empty-state" style="margin-top:12px"><a class="btn secondary" href="/entrar" style="text-decoration:none">Entre para comentar</a></div>`
        : `<form class="cm-form" data-parent="${parentId}">${parentId ? '' : BX.avatarHtml(me, { size: 32 })}<div><textarea name="body" maxlength="2000" placeholder="${parentId ? 'Sua resposta…' : 'Comente… (use @usuario para marcar)'}" required>${to ? `@${to} ` : ''}</textarea><div class="mention-menu" hidden></div><div class="composer-row" style="justify-content:flex-end">${parentId ? '<button type="button" class="btn ghost" data-cancel-reply>Cancelar</button>' : ''}<button class="btn primary">${icon('publish', 14)}Enviar</button></div></div></form>`;
      const setCount = (n) => { document.getElementById('cmCount').textContent = `${n} comentário${n === 1 ? '' : 's'}`; document.querySelectorAll('[data-cc]').forEach((x) => { x.textContent = n; }); };

      async function renderPost() {
        try {
          const j = await BX.api(`/api/posts/${postId}`);
          current = j; if (j.flag) j.post.flag = j.flag;
          document.title = `${j.post.title} — Comunidade BX Deck Lab`;
          app.innerHTML = `<div class="com-layout">
            <section class="com-main">
              <a class="btn ghost" href="/comunidade" style="text-decoration:none;margin-bottom:12px;display:inline-flex">${icon('back', 14)}Voltar ao feed</a>
              <div class="post-list" id="postWrap">${BXPost.card(j.post, { full: true })}</div>
              <section class="comments" id="comentarios">
                <div class="section-title-row" style="margin-bottom:10px"><div><p class="eyebrow">COMENTÁRIOS</p><h2 id="cmCount" style="font-size:22px">${j.post.commentCount} comentário${j.post.commentCount === 1 ? '' : 's'}</h2></div></div>
                <div id="cmRoot">${j.post.status === 'VISIBLE' ? commentForm() : '<div class="empty-state">Comentários abrem quando o post for publicado.</div>'}</div>
                <div id="cmList">${commentsTree(j.comments) || '<div class="empty-state">Ninguém comentou ainda.</div>'}</div>
              </section>
            </section>
            ${sideHtml()}
          </div>`;
          BXPost.bind(app, { getPost: () => current.post, onDeleted: () => { location.href = '/comunidade'; } });
          if (location.hash.startsWith('#c-')) document.querySelector(location.hash)?.scrollIntoView({ block: 'center' });
          if (j.post.status === 'SCANNING') setTimeout(renderPost, 4000);
        } catch (e) { app.innerHTML = `<div class="empty-state">${esc(e.message)} — <a href="/comunidade" style="color:var(--cyan)">voltar</a></div>`; }
      }
      app.addEventListener('submit', async (e) => {
        const f = e.target.closest('.cm-form'); if (!f) return;
        e.preventDefault();
        const body = f.body.value.trim(); if (!body) return;
        const btn = f.querySelector('.btn.primary'); btn.disabled = true;
        try {
          const j = await BX.api(`/api/posts/${postId}/comments`, { method: 'POST', body: { body, parentId: f.dataset.parent || null } });
          current.comments.push(j.comment); current.post.commentCount = j.commentCount;
          document.getElementById('cmList').innerHTML = commentsTree(current.comments);
          setCount(j.commentCount);
          if (f.dataset.parent) f.remove(); else f.body.value = '';
          document.getElementById(`c-${j.comment.id}`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
        } catch (er) { BX.toast(er.message); btn.disabled = false; }
      });
      app.addEventListener('click', async (e) => {
        const r = e.target.closest('[data-reply]');
        if (r) { document.querySelectorAll('.cm-form[data-parent]:not([data-parent=""])').forEach((x) => x.remove()); r.closest('.cm').querySelector('.cm-actions').insertAdjacentHTML('afterend', commentForm(r.dataset.reply, r.dataset.to)); r.closest('.cm').querySelector('textarea')?.focus(); return; }
        if (e.target.closest('[data-cancel-reply]')) { e.target.closest('.cm-form').remove(); return; }
        const rc = e.target.closest('[data-report-c]'); if (rc) return BX.report('COMMENT', rc.dataset.reportC, 'este comentário');
        const d = e.target.closest('[data-delc]');
        if (d && await BX.confirmDialog({ title: 'Excluir comentário?', okLabel: 'Excluir', danger: true })) {
          try { const j = await BX.api(`/api/comments/${d.dataset.delc}`, { method: 'DELETE' }); const c = current.comments.find((x) => x.id === d.dataset.delc); if (c) c.status = 'REMOVED'; current.post.commentCount = j.commentCount; document.getElementById('cmList').innerHTML = commentsTree(current.comments); setCount(j.commentCount); } catch (er) { BX.toast(er.message); }
        }
      });
      let mentionTimer = 0;
      app.addEventListener('input', (e) => {
        const ta = e.target; if (ta.tagName !== 'TEXTAREA' || !ta.closest('.cm-form')) return;
        const menu = ta.closest('.cm-form').querySelector('.mention-menu');
        const m = ta.value.slice(0, ta.selectionStart).match(/@([a-z0-9-]{2,30})$/i);
        clearTimeout(mentionTimer);
        if (!m) { menu.hidden = true; return; }
        mentionTimer = setTimeout(async () => {
          const { users } = await BX.api(`/api/users/search?q=${encodeURIComponent(m[1])}`).catch(() => ({ users: [] }));
          if (!users.length) { menu.hidden = true; return; }
          menu.hidden = false;
          menu.innerHTML = users.map((u) => `<button type="button" data-slug="${esc(u.slug)}">${BX.avatarHtml(u, { size: 22 })}<span>${esc(u.name)} <small style="color:var(--muted)">@${esc(u.slug)}</small></span></button>`).join('');
          menu.onclick = (ev) => { const b = ev.target.closest('[data-slug]'); if (!b) return; const pos = ta.selectionStart; const before = ta.value.slice(0, pos).replace(/@[a-z0-9-]{2,30}$/i, `@${b.dataset.slug} `); ta.value = before + ta.value.slice(pos); menu.hidden = true; ta.focus(); ta.setSelectionRange(before.length, before.length); };
        }, 220);
      });

      if (postId) renderPost(); else if (isNew) renderComposer(); else renderFeed();
    })();
  </script>
</body>
</html>
