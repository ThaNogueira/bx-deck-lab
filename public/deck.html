<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap"></noscript>
  <meta name="theme-color" content="#090a0f" />
  <title>Deck — BX Deck Lab</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="noise"></div>
  <header id="topbar"></header>
  <main id="app"><div class="empty-state">Carregando deck…</div></main>
  <script src="/js/shared.js"></script>
  <script>
    (async () => {
      BX.renderTopbar('/decks');
      await BX.partTagReady();
      const slug = BX.pathPart(1);
      const app = document.getElementById('app');
      let deck;
      try {
        deck = (await BX.api(`/api/decks/${encodeURIComponent(slug)}`)).deck;
      } catch (e) {
        app.innerHTML = `<div class="empty-state">${BX.esc(e.message)} — <a href="/decks" style="color:var(--cyan)">ver todos os decks</a></div>`;
        return;
      }
      document.title = `${deck.title} — BX Deck Lab`;
      const me = await BX.me().catch(() => null);
      const mine = me && deck.author && me.id === deck.author.id;
      const embed = BX.ytEmbed(deck.youtubeUrl);

      const beysHtml = deck.beys.map((bey, i) => `
        <div class="list-card">
          <h3>Bey ${i + 1}</h3>
          ${BX.beyVisual(bey.map((id) => deck.parts?.[id] || id), { size: 'lg' })}
        </div>`).join('');

      app.innerHTML = `
        <div class="hero compact">
          <div>
            <p class="eyebrow">${deck.isPublic === false ? `${BX.ic('lock', 14)} DECK PRIVADO • SÓ VOCÊ VÊ` : 'DECK DA COMUNIDADE'}${deck.featured ? ` • ${BX.ic('star', 14)} EM DESTAQUE` : ''}</p>
            <h1>${BX.esc(deck.title)}</h1>
            <div class="author-line" style="margin-top:10px">
              ${BX.avatarHtml(deck.author, { size: 46 })}
              <span>
                <a href="/u/${deck.author?.slug}">${BX.esc(deck.author?.name || '?')}</a>
                <small>publicado em ${BX.dateFmt(deck.createdAt, { day: '2-digit', month: 'long', year: 'numeric' })}</small>
              </span>
            </div>
          </div>
          <div class="hero-actions">
            ${mine ? `<button class="btn secondary" id="visBtn">${deck.isPublic === false ? `${BX.ic('globe', 14)} Tornar público` : `${BX.ic('lock', 14)} Tornar privado`}</button><a class="btn secondary" href="/deck/${deck.slug}/editar">Editar</a><a class="btn ghost" href="/meus-decks">Meus decks</a>` : ''}
            ${mine ? (deck.sharedPostId ? `<a class="btn secondary" href="/comunidade/p/${deck.sharedPostId}" style="text-decoration:none">${BX.ic('feed', 14)} Ver post na comunidade</a>` : `<button class="btn secondary" id="shareBtn">${BX.ic('feed', 14)} Compartilhar na comunidade</button>`) : ''}
            ${!mine && deck.isPublic !== false ? `<button class="btn primary" id="copyBtn" title="Salva uma cópia privada em Meus decks e conta no ranking do meta">${BX.ic('save', 14)} Copiar deck<small class="copy-count" id="copyCount">${deck.copyCount || 0}</small></button><a class="btn secondary" href="/?copiar=${deck.slug}#builder" style="text-decoration:none">${BX.ic('builder', 14)} Abrir no builder</a>` : ''}
            ${mine ? `<button class="btn danger-outline" id="delBtn">Excluir</button>` : `<button class="btn ghost" id="reportBtn">${BX.ic('flag', 14)} Denunciar</button>`}
          </div>
        </div>
        <div class="deck-viewer" style="margin-bottom:20px">${beysHtml}</div>
        <div class="profile-grid">
          <div style="display:flex;flex-direction:column;gap:16px">
            ${deck.description ? `<div class="panel-card"><p class="eyebrow">SOBRE O DECK</p><p class="prose">${BX.esc(deck.description)}</p></div>` : ''}
            ${deck.launchGuide ? `<div class="panel-card"><p class="eyebrow">GUIA DE LANÇAMENTO</p><p class="prose">${BX.esc(deck.launchGuide)}</p></div>` : ''}
          </div>
          <div>
            ${embed ? `<div class="video-embed"><iframe src="${embed}" title="Vídeo do deck" allowfullscreen loading="lazy"></iframe></div>` : ''}
          </div>
        </div>`;

      document.getElementById('reportBtn')?.addEventListener('click', () => BX.report('DECK', deck.id, 'este deck'));
      const shareNow = async () => {
        const text = await BX.promptDialog({ title: 'Compartilhar na comunidade', text: 'Descreva a build (opcional). O post nasce com a tag Deck e botões de abrir no builder e copiar.', placeholder: 'ex.: Deck de stamina com bit Ball…', multiline: true, okLabel: 'Publicar na comunidade' });
        if (text === null) return;
        try {
          const r = await BX.api(`/api/decks/${deck.id}/share`, { method: 'POST', body: { body: text } });
          BX.toast(r.already ? 'Este deck já estava na comunidade.' : 'Deck compartilhado!');
          location.href = `/comunidade/p/${r.post.id}`;
        } catch (e) { BX.toast(e.message); }
      };
      document.getElementById('shareBtn')?.addEventListener('click', shareNow);
      if (mine && !deck.sharedPostId && new URLSearchParams(location.search).get('compartilhar') === '1') { history.replaceState(null, '', location.pathname); shareNow(); }
      document.getElementById('copyBtn')?.addEventListener('click', async (e) => {
        const u = await BX.requireLogin(location.pathname); if (!u) return;
        const btn = e.currentTarget; btn.disabled = true;
        try {
          const r = await BX.api(`/api/decks/${deck.id}/copy`, { method: 'POST' });
          document.getElementById('copyCount').textContent = r.copyCount;
          BX.toast(r.counted ? 'Deck copiado para Meus decks (pasta "Copiados").' : 'Nova cópia salva em Meus decks.');
          btn.innerHTML = `${BX.ic('check', 14)} Copiado <a href="/deck/${r.deck.slug}" style="color:inherit;margin-left:6px;text-decoration:underline">abrir cópia</a>`; btn.disabled = false;
        } catch (er) { BX.toast(er.message); btn.disabled = false; }
      });
      document.getElementById('visBtn')?.addEventListener('click', async () => {
        try {
          await BX.api(`/api/decks/${deck.id}`, { method: 'PATCH', body: { isPublic: deck.isPublic === false } });
          location.reload();
        } catch (e) { BX.toast(e.message); }
      });
      document.getElementById('delBtn')?.addEventListener('click', async () => {
        if (!confirm('Excluir este deck? Essa ação não tem volta.')) return;
        try { await BX.api(`/api/decks/${deck.id}`, { method: 'DELETE' }); location.href = '/decks'; }
        catch (e) { BX.toast(e.message); }
      });
    })();
  </script>
</body>
</html>
