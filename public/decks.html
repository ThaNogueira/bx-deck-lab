<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap"></noscript>
  <meta name="theme-color" content="#090a0f" />
  <title>Decks da comunidade — BX Deck Lab</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/design-system.css" />
</head>
<body>
  <div class="noise"></div>
  <header id="topbar"></header>
  <main>
    <div class="hero compact">
      <div>
        <p class="eyebrow">COMUNIDADE</p>
        <h1>Deck lists <em>da galera</em></h1>
        <p>Decks publicados pelos jogadores, com guia de lançamento e vídeo. Publique o seu!</p>
      </div>
      <div class="hero-actions">
        <button class="btn primary" id="newDeck">+ Publicar deck</button>
      </div>
    </div>
    <div class="page-toolbar">
      <input id="q" placeholder="Buscar deck ou autor…" />
      <select id="filter" aria-label="Ordenar decks">
        <option value="">Mais recentes</option>
        <option value="featured">Em destaque</option>
      </select>
    </div>
    <div id="list" class="deck-directory"><div class="empty-state">Carregando decks…</div></div>
  </main>
  <script src="/js/shared.js"></script>
  <script>
    (async () => {
      BX.renderTopbar('/decks');
      await BX.partTagReady();
      document.getElementById('newDeck').addEventListener('click', async () => {
        if (await BX.requireLogin('/#builder')) location.href = '/#builder';
      });
      let timer;
      async function load() {
        const q = document.getElementById('q').value;
        const featured = document.getElementById('filter').value === 'featured' ? '1' : '';
        const { decks } = await BX.api(`/api/decks?query=${encodeURIComponent(q)}&featured=${featured}`);
        document.getElementById('list').innerHTML = decks.length
          ? decks.map((d) => `
            <article class="deck-directory-row ${d.achievements?.some((a) => a.place === 1) ? 'deck-directory-champion' : ''}">
              <a class="deck-directory-main" href="/deck/${d.slug}">
                <div class="deck-directory-copy">
                  <div class="deck-directory-title">${d.achievements?.length ? `<span class="deck-podium-icon p${d.achievements[0].place}" title="${BX.esc(`${d.achievements[0].place}º lugar — ${d.achievements[0].tournament.name`)}"><img src="/assets/achievements/trophy-neon-gold.png" alt="" /></span>` : ''}<h2>${BX.esc(d.title)}</h2>${d.featured ? `<span class="badge owned">${BX.ic('star', 14)} destaque</span>` : ''}</div>
                  ${d.description ? `<p>${BX.esc(d.description)}</p>` : '<p class="deck-directory-empty">Sem descrição do deck.</p>'}
                </div>
                <div class="deck-directory-preview">${BX.deckPreview(d.beys, { u: 42 })}</div>
                <div class="deck-directory-author">
                  ${BX.avatarHtml(d.author, { size: 34 })}
                  <span><b>${BX.esc(d.author?.name || '?')}</b><small>Criado em ${BX.dateFmt(d.createdAt, { day: '2-digit', month: 'short', year: 'numeric' })}</small></span>
                </div>
              </a>
              <button class="btn secondary deck-directory-copy-btn" type="button" data-copy-text="${BX.esc(d.id)}" title="Copiar lista das Beys">${BX.ic('link', 14)}<span>Copiar</span></button>
            </article>`).join('')
          : '<div class="empty-state">Nenhum deck publicado ainda — seja a primeira pessoa!</div>';
        document.querySelectorAll('[data-copy-text]').forEach((button) => button.addEventListener('click', async () => {
          const deck = decks.find((d) => d.id === button.dataset.copyText);
          try { await BX.copyDeckText(deck?.beys); BX.toast('Lista das Beys copiada!'); }
          catch (e) { BX.toast(e.message); }
        }));
      }
      document.getElementById('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 300); });
      document.getElementById('filter').addEventListener('change', load);
      load();
    })();
  </script>
</body>
</html>
