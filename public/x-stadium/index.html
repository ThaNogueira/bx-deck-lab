<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#202c28">
  <meta name="description" content="Batalhas 3D de Beyblade X no estádio BX-10. Monte seu pião e dispute um duelo 1v1.">
  <title>X Stadium — Arena Beyblade X</title>
  <link rel="icon" href="./assets/mark.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="stage" id="stage" data-phase="setup" aria-label="X Stadium · Arena BX-10">
  <div id="world"></div>
  <div class="arena-fit" aria-hidden="true"></div>
  <header class="top-bar">
    <div class="brand"><img src="./assets/mark.svg" width="30" height="30" alt=""><h1>X STADIUM</h1></div>
    <div class="round-badge"><span id="round-label">RODADA 1</span><span id="stage-state">PREPARAÇÃO</span></div>
    <nav class="session-tools" aria-label="Partida">
      <details class="tool-menu">
        <summary class="icon-btn" aria-label="Câmera" title="Câmera"><i data-icon="camera"></i></summary>
        <div class="tool-popover" id="camera-tools">
          <div class="camera-group">
            <button id="camera-orbit" class="icon-btn selected" data-action="orbit" aria-label="Órbita 3D" title="Órbita 3D" aria-pressed="true"><i data-icon="cube"></i></button>
            <button id="camera-top" class="icon-btn" data-action="top" aria-label="Vista superior fixa" title="Vista superior fixa" aria-pressed="false"><i data-icon="top"></i></button>
            <button id="camera-follow" class="icon-btn" data-action="follow" aria-label="Seguir as Beys" title="Seguir as Beys" aria-pressed="false"><i data-icon="focus"></i></button>
          </div>
          <div class="camera-group">
            <button class="icon-btn" data-action="zoom-out" aria-label="Afastar câmera" title="Afastar câmera"><i data-icon="minus"></i></button>
            <button class="icon-btn" data-action="zoom-in" aria-label="Aproximar câmera" title="Aproximar câmera"><i data-icon="plus"></i></button>
            <button class="icon-btn" data-action="camera-reset" aria-label="Recentralizar câmera" title="Recentralizar câmera"><i data-icon="reset"></i></button>
            <button class="icon-btn" id="camera-drag" data-action="camera-drag" aria-label="Arrastar para mover a câmera" title="Arrastar para mover a câmera" aria-pressed="false"><i data-icon="hand"></i></button>
            <button class="icon-btn" id="camera-lock" data-action="camera-lock" aria-label="Fixar câmera" title="Fixar câmera" aria-pressed="false"><i data-icon="lock"></i></button>
          </div>
        </div>
      </details>
      <details class="tool-menu">
        <summary class="icon-btn" aria-label="Configurações" title="Configurações"><i data-icon="menu"></i></summary>
        <div class="tool-popover settings-menu">
          <button class="mode-pill" data-action="multiplayer" aria-label="Modo de jogo e multijogador" title="Modo de jogo e multijogador"><i data-icon="cpu"></i><span id="mode-name">TREINO COM IA</span></button>
          <label class="graphics-setting" for="graphics">Gráficos<select id="graphics"><option value="auto">Automático</option><option value="low">Leve</option><option value="medium">Equilibrado</option><option value="high">Alto</option></select></label>
          <button class="mode-pill" data-action="sound" aria-pressed="false"><i data-icon="muted"></i><span>Ativar som</span></button>
          <button class="mode-pill" id="fullscreen" data-action="fullscreen" aria-pressed="false" hidden><i data-icon="expand"></i><span>Tela cheia</span></button>
          <button class="mode-pill" data-action="help"><i data-icon="help"></i><span>Como jogar</span></button>
        </div>
      </details>
    </nav>
  </header>

  <div class="player-hud" aria-label="Placar e piões">
    <section class="player-panel p1" id="player1-panel">
      <div class="player-score"><div><span>JOGADOR 1</span><div class="score-pips" id="pips1" aria-hidden="true"></div></div><strong id="score1">0</strong></div>
      <div id="bey1" class="bey-card"></div>
    </section>
    <section class="player-panel p2" id="player2-panel">
      <div class="player-score"><div><span id="player2-label">CPU</span><div class="score-pips" id="pips2" aria-hidden="true"></div></div><strong id="score2">0</strong></div>
      <div id="bey2" class="bey-card"></div>
    </section>
  </div>

  <section class="launch-panel" id="launch-panel" aria-label="Ajustes de lançamento">
    <div class="launch-title"><h2 id="launch-title">Lançador</h2><p id="launch-hint">Arraste na arena para posicionar.</p></div>
    <div class="launch-modes" id="launch-modes" role="group" aria-label="Ajuste na arena">
      <button type="button" data-launch-mode="position" aria-pressed="true">Posição</button>
      <button type="button" data-launch-mode="heading" aria-pressed="false">Mira <output id="heading-value">0°</output></button>
      <button type="button" data-launch-mode="angle" aria-pressed="false">Inclinação <output id="angle-value">0°</output></button>
    </div>
    <button class="launch-button ripcord" id="launch" disabled><i data-icon="bolt"></i><span>Puxe e solte</span><output id="power-value">94%</output></button>
  </section>

  <div id="combat-controls" class="combat-controls" role="group" aria-label="Comandos de batalha" hidden></div>
  <p class="sr-only" id="last-event" role="status">Arena pronta para o lançamento.</p>
  <div id="callout" class="callout" hidden></div>
  <div id="battle-overlay" class="battle-overlay" aria-live="polite" hidden></div>
  <div id="webgl-error" class="battle-overlay" role="alert" hidden>O navegador precisa de WebGL 2 para abrir a arena.</div>
  <div class="loading" id="loading" role="status"><span></span> Carregando arena</div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
</main>
<script defer src="./vendor/peer.js"></script>
<script type="module" src="./game.js"></script>
</body>
</html>
