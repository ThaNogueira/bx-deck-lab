<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap"></noscript>
  <meta name="theme-color" content="#090a0f" />
  <title>Torneio — BX Deck Lab</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="noise"></div>
  <header id="topbar"></header>
  <main id="app"><div class="empty-state">Carregando torneio…</div></main>
  <script src="/js/shared.js"></script>
  <script>
    (async () => {
      BX.renderTopbar('/torneios');
      const slug = BX.pathPart(1);
      const app = document.getElementById('app');
      const VIEWS = ['geral', 'partida', 'gestao'];
      const hashView = () => { const v = location.hash.slice(1); return VIEWS.includes(v) ? v : 'geral'; };
      let view = hashView(); // geral | partida | gestao — fica no hash: recarregar/voltar não perde a aba
      let pollTimer = null;
      let last = null;       // {data, me, myData} do último load — re-render sem nova chamada
      let lastSig = '';      // assinatura do último payload — poll só re-renderiza se algo mudou
      let pendingRender = false;
      const editing = () => { const el = document.activeElement; return !!el && app.contains(el) && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName); };
      let roundsMode = localStorage.getItem('bx_tmode') || (matchMedia('(max-width:700px)').matches ? 'list' : 'tree');

      const STATUS_PT = { OPEN: 'inscrições abertas', RUNNING: 'em andamento', FINISHED: 'encerrado', CANCELED: 'cancelado' };

      async function load(prefetched = null) {
        let data = prefetched;
        if (!data) {
          try {
            data = await BX.api(`/api/tournaments/${encodeURIComponent(slug)}`);
          } catch (e) {
            app.innerHTML = `<div class="empty-state">${BX.esc(e.message)} — <a href="/torneios" style="color:var(--cyan)">ver torneios</a></div>`;
            return;
          }
        }
        const me = await BX.me().catch(() => null);
        const myMatch = me && data.me ? await BX.api(`/api/tournaments/${encodeURIComponent(slug)}/me`).catch(() => null) : null;
        const sig = JSON.stringify([data, myMatch]);
        last = { data, me, myData: myMatch };
        if (sig === lastSig && prefetched) return; // nada mudou: não mexe na tela
        lastSig = sig;
        if (editing()) { pendingRender = true; return; } // não apaga o que a pessoa está digitando
        render(data, me, myMatch);
      }
      // Depois que a pessoa sai do campo, aplica a atualização que ficou pendente
      app.addEventListener('focusout', () => { if (pendingRender && last) { pendingRender = false; setTimeout(() => { if (!editing()) render(last.data, last.me, last.myData); }, 150); } });
      window.addEventListener('hashchange', () => { const v = hashView(); if (v !== view) { view = v; if (last) render(last.data, last.me, last.myData); } });

      function render(data, me, myData) {
        const t = data.tournament;
        document.title = `${t.name} — BX Deck Lab`;
        const joined = !!data.me;
        const tabs = [
          ['geral', 'Torneio'],
          ...(joined && t.status === 'RUNNING' ? [['partida', '🎯 Minha partida']] : []),
          ...(t.canManage ? [['gestao', '⚙ Gestão']] : []),
        ];

        app.innerHTML = `
          <div class="hero compact">
            <div>
              <p class="eyebrow">${BX.dateFmt(t.startsAt, { weekday: 'long', day: '2-digit', month: 'long', hour: '2-digit', minute: '2-digit' })}</p>
              <h1>${BX.esc(t.name)}</h1>
              <p>
                <span class="status-chip ${t.status}">${STATUS_PT[t.status]}${t.status === 'RUNNING' ? ` — rodada ${t.currentRound}/${t.roundsPlanned}` : ''}</span>
                ${t.storeName ? ` 🏬 ${BX.esc(t.storeName)}` : ''}${t.address ? ` • 📍 ${BX.esc(t.address)}` : ''}
                • ${t.format === 'MD3' ? 'Melhor de 3' : 'Partida simples até 4 pontos'}
              </p>
            </div>
            <div class="hero-actions">
              ${t.status === 'OPEN' && !joined ? `<button class="btn primary" id="joinBtn">Entrar no torneio</button>` : ''}
              ${t.status === 'OPEN' && joined ? `<button class="btn danger-outline" id="leaveBtn">Sair do torneio</button>` : ''}
              <button class="btn ghost icon-only" id="reportBtn" aria-label="Denunciar torneio" title="Denunciar torneio">⚑</button>
            </div>
          </div>
          ${tabs.length > 1 ? `<nav class="tabs" style="justify-content:flex-start;margin-bottom:18px" aria-label="Seções do torneio">${tabs.map(([k, label]) => `<button class="tab${view === k ? ' active' : ''}" data-view="${k}" aria-selected="${view === k}">${label}</button>`).join('')}</nav>` : ''}
          <div id="viewBox"></div>`;

        document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => { view = b.dataset.view; history.replaceState(null, '', '#' + view); render(data, me, myData); }));
        document.getElementById('joinBtn')?.addEventListener('click', () => { location.href = `/t/${t.slug}`; });
        document.getElementById('leaveBtn')?.addEventListener('click', async () => {
          if (!confirm('Sair deste torneio?')) return;
          await BX.api(`/api/tournaments/${slug}/leave`, { method: 'POST' }).catch((e) => BX.toast(e.message));
          load();
        });
        document.getElementById('reportBtn')?.addEventListener('click', () => BX.report('TOURNAMENT', t.id, 'este torneio'));

        const box = document.getElementById('viewBox');
        if (view === 'partida' && myData?.match) renderMatch(box, t, myData);
        else if (view === 'gestao' && t.canManage) renderManage(box, t, data);
        else renderGeneral(box, t, data);
      }

      function matchStatus(t, m) {
        if (m.bye) return ['bye', 'BYE'];
        if (m.status === 'DONE') return ['done', 'Finalizada'];
        if (m.status === 'CONFLICT') return ['conflict', 'Conflito'];
        if (t.status === 'RUNNING' && m.round === t.currentRound) return ['live', (m.p1Reported || m.p2Reported) ? 'Ao vivo · 1 reporte' : 'Ao vivo'];
        return ['pending', 'Pendente'];
      }
      function competitor(pl, { won = false, lost = false, reported = false, bye = false } = {}) {
        const name = BX.esc(pl?.user?.name || (bye ? 'BYE' : '?'));
        const av = pl ? BX.avatarHtml(pl.user, { size: 28 }) : '<span class="avatar" style="width:28px;height:28px"><b>—</b></span>';
        const tag = won ? 'venceu' : reported ? 'reportou' : '';
        return `<div class="competitor ${won ? 'winner' : ''} ${lost ? 'loser' : ''}">${av}<span title="${name}">${name}</span>${tag ? `<b class="rep">${tag}</b>` : '<span></span>'}</div>`;
      }
      function renderRounds(t, data) {
        if (!data.matches?.length) return '';
        const rounds = [...new Set(data.matches.map((m) => m.round))].sort((a, b) => a - b);
        const isCur = (r) => t.status === 'RUNNING' && r === t.currentRound;
        const card = (m) => {
          const [st, label] = matchStatus(t, m);
          const done = m.status === 'DONE';
          const score = t.format === 'MD3' && (m.p1Score || m.p2Score) ? ` · ${m.p1Score}–${m.p2Score}` : '';
          return `<article class="bracket-match ${st} ${done ? 'decided' : ''}">
            <header class="bm-head"><small>${m.bye ? `Mesa ${m.tableNo}` : `<a href="/mesa/${t.slug}/${m.id}" style="color:inherit;text-decoration:none" title="Abrir tela de mesa">Mesa ${m.tableNo}${score}</a>`}</small><span class="m-status ${st}">${label}</span></header>
            ${competitor(m.p1, { won: done && m.winnerId === m.p1?.id, lost: done && !!m.winnerId && m.winnerId !== m.p1?.id, reported: !done && m.p1Reported })}
            ${competitor(m.p2, { won: done && m.winnerId === m.p2?.id, lost: done && !!m.winnerId && m.winnerId !== m.p2?.id, reported: !done && m.p2Reported, bye: m.bye })}
          </article>`;
        };
        const cols = rounds.map((r) => `<section class="bracket-round ${isCur(r) ? 'current' : ''}" data-round="${r}"><h3>Rodada ${r}${isCur(r) ? ' · em andamento' : ''}</h3><div class="round-matches">${data.matches.filter((m) => m.round === r).sort((a, b) => a.tableNo - b.tableNo).map(card).join('')}</div></section>`).join('');
        return `
          <div class="section-title-row" style="margin:18px 0 10px"><div><p class="eyebrow">RODADAS</p><h2>Chaveamento</h2></div></div>
          <div class="bracket-tools">
            <div class="bracket-rounds" id="tRounds" aria-label="Ir para a rodada" ${rounds.length < 2 ? 'hidden' : ''}>${rounds.map((r, i) => `<button type="button" data-round="${r}" class="${isCur(r) ? 'current' : ''} ${i === 0 ? 'active' : ''}">R${r}${isCur(r) ? ' •' : ''}</button>`).join('')}</div>
            <div class="bracket-actions"><button type="button" class="btn secondary" id="tModeBtn">${roundsMode === 'list' ? 'Ver como chave' : 'Ver como lista'}</button></div>
          </div>
          <div class="bracket-viewport free ${roundsMode === 'list' ? 'list' : ''}" id="tViewport"><div class="bracket">${cols}</div></div>
          <p class="bracket-scroll-hint">Arraste para o lado para ver as outras rodadas.</p>`;
      }
      function wireRounds(box) {
        const vp = box.querySelector('#tViewport'); if (!vp) return;
        const pills = [...box.querySelectorAll('#tRounds button')];
        const secs = [...vp.querySelectorAll('.bracket-round')];
        box.querySelector('#tModeBtn')?.addEventListener('click', () => { roundsMode = roundsMode === 'list' ? 'tree' : 'list'; localStorage.setItem('bx_tmode', roundsMode); if (last) render(last.data, last.me, last.myData); });
        pills.forEach((b) => b.addEventListener('click', () => {
          const sec = secs.find((s) => s.dataset.round === b.dataset.round); if (!sec) return;
          if (roundsMode === 'list') window.scrollTo({ top: sec.getBoundingClientRect().top + window.scrollY - 130, behavior: 'smooth' });
          else vp.scrollTo({ left: sec.offsetLeft - 14, behavior: 'smooth' });
        }));
        const mark = () => {
          let idx = 0;
          if (roundsMode === 'list') secs.forEach((s, i) => { if (s.getBoundingClientRect().top <= 150) idx = i; });
          else { const x = vp.scrollLeft + vp.clientWidth * 0.35; secs.forEach((s, i) => { if (s.offsetLeft <= x) idx = i; }); }
          pills.forEach((b, i) => b.classList.toggle('active', i === idx));
        };
        let raf = 0; const tick = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(mark); };
        vp.addEventListener('scroll', tick, { passive: true });
        if (wireRounds._scroll) window.removeEventListener('scroll', wireRounds._scroll);
        wireRounds._scroll = () => { if (roundsMode === 'list' && document.body.contains(vp)) tick(); };
        window.addEventListener('scroll', wireRounds._scroll, { passive: true });
        // Começa na rodada em andamento
        const cur = secs.find((s) => s.classList.contains('current'));
        if (cur && roundsMode !== 'list') vp.scrollLeft = cur.offsetLeft - 14;
        mark();
      }

      function renderGeneral(box, t, data) {
        const standings = data.standings.length ? `
          <div class="panel-card" style="margin-top:16px">
            <p class="eyebrow">CLASSIFICAÇÃO</p>
            <div class="standings-wrap" style="margin-top:10px"><table class="standings">
              <tr><th>#</th><th>Jogador</th><th>V</th><th>D</th><th>Buchholz</th></tr>
              ${data.standings.map((s, i) => `<tr><td>${i + 1}</td><td><span class="standing-player">${BX.avatarHtml(s.player.user, { size: 24 })}${BX.esc(s.player.user.name)}${s.player.dropped ? ' <small style="color:var(--muted)">(drop)</small>' : ''}</span></td><td>${s.wins}</td><td>${s.losses}</td><td>${s.sos}</td></tr>`).join('')}
            </table></div>
          </div>` : '';
        box.innerHTML = `
          ${t.description ? `<div class="panel-card" style="margin-bottom:16px"><p class="prose" style="margin:0">${BX.esc(t.description)}</p></div>` : ''}
          <div class="section-title-row" style="margin-bottom:10px">
            <div><p class="eyebrow">INSCRITOS</p><h2>${data.players.length} jogador(es)</h2></div>
          </div>
          <div class="player-list" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">
            ${data.players.map((p) => `
              <a class="player-card" href="/u/${p.user.slug}" style="text-decoration:none;color:inherit;${p.dropped ? 'opacity:.5' : ''}">
                ${BX.avatarHtml(p.user, { size: 44 })}
                <div><h3>${BX.esc(p.user.name)}</h3><small>@${BX.esc(p.user.slug)}${p.dropped ? ' • DROP' : ''}</small></div>
              </a>`).join('') || '<div class="empty-state">Ninguém inscrito ainda.</div>'}
          </div>
          ${renderRounds(t, data)}
          ${standings}`;
        wireRounds(box);
      }

      function renderMatch(box, t, myData) {
        const m = myData.match;
        if (m.bye) {
          box.innerHTML = `<div class="match-screen"><p class="eyebrow">RODADA ${myData.round}</p><div class="match-vs">BYE</div><p style="color:var(--muted)">Você folga nesta rodada e já tem a vitória. Descanse o pulso! 💪</p></div>`;
          return;
        }
        const done = m.status === 'DONE';
        box.innerHTML = `
          <div class="match-screen">
            <p class="eyebrow">RODADA ${myData.round} • ${t.format === 'MD3' ? 'MELHOR DE 3' : 'ATÉ 4 PONTOS'}</p>
            <div style="margin:6px 0 2px">${BX.avatarHtml(m.opponent, { size: 84 })}</div>
            <div class="match-vs">VS ${BX.esc(m.opponent?.name || '?')}</div>
            <div class="match-table">Mesa ${m.tableNo}${t.format === 'MD3' && (m.myScore || m.oppScore) ? ` · rounds ${m.myScore}–${m.oppScore}` : ''}</div>
            ${!done ? `<a class="btn primary mesa-link" href="/mesa/${t.slug}/${m.id}">📺 Abrir tela de mesa</a>` : ''}
            ${done
              ? `<div class="match-score-zero" style="color:${m.won ? 'var(--green)' : 'var(--red)'}">${m.won ? 'VITÓRIA' : 'DERROTA'}</div><p style="color:var(--muted)">Resultado fechado. Aguarde a próxima rodada.</p>`
              : `<div class="match-score-zero">0 — 0</div>
                 ${m.status === 'CONFLICT' ? `<div class="conflict-banner">⚠ Os dois jogadores reportaram o mesmo resultado. O organizador foi notificado e vai resolver com vocês.</div>` : ''}
                 ${m.myReport
                   ? `<p style="color:var(--muted)">Você reportou <b style="color:${m.myReport === 'WIN' ? 'var(--green)' : 'var(--red)'}">${m.myReport === 'WIN' ? 'vitória' : 'derrota'}</b>. ${m.opponentReported ? '' : 'Aguardando o oponente…'}</p>`
                   : `<p style="color:var(--muted)">Terminou a partida? Reporte o SEU resultado:</p>
                      <div class="report-row">
                        <button class="report-btn win" data-report="WIN">✔ Venci</button>
                        <button class="report-btn loss" data-report="LOSS">✖ Perdi</button>
                      </div>`}`}
          </div>`;
        box.querySelectorAll('[data-report]').forEach((btn) => btn.addEventListener('click', async () => {
          try {
            const res = await BX.api(`/api/tournaments/${slug}/report`, { method: 'POST', body: { matchId: m.id, result: btn.dataset.report } });
            if (res.conflict) BX.toast('Conflito de resultado — o organizador vai verificar.');
            load();
          } catch (e) { BX.toast(e.message); }
        }));
      }

      function renderManage(box, t, data) {
        const roundMatches = data.matches.filter((m) => m.round === t.currentRound);
        const conflicts = roundMatches.filter((m) => m.status === 'CONFLICT');
        box.innerHTML = `
          ${conflicts.length ? `<div class="conflict-banner" style="margin-bottom:14px">⚠ <b>${conflicts.length} conflito(s) de resultado</b> nesta rodada — verifique com os jogadores e escolha o vencedor abaixo antes de fechar a rodada.</div>` : ''}
          <div class="profile-grid">
            <div style="display:flex;flex-direction:column;gap:16px">
              <div class="panel-card">
                <p class="eyebrow">CONTROLE DO TORNEIO</p>
                <div class="inline-actions" style="justify-content:flex-start;margin-top:12px">
                  ${t.status === 'OPEN' ? `<button class="btn primary" id="startBtn">▶ Começar (rodada 1)</button>` : ''}
                  ${t.status === 'RUNNING' && t.currentRound < t.roundsPlanned ? `<button class="btn primary" id="nextBtn">Fechar rodada e parear a próxima</button>` : ''}
                  ${t.status === 'RUNNING' ? `<button class="btn secondary" id="finishBtn">🏁 Encerrar torneio</button>` : ''}
                  ${t.status !== 'CANCELED' && t.status !== 'FINISHED' ? `<button class="btn danger-outline" id="cancelBtn">Cancelar torneio</button>` : ''}
                </div>
              </div>
              ${t.status !== 'OPEN' ? `
              <div class="panel-card">
                <p class="eyebrow">RODADA ${t.currentRound} — PARTIDAS</p>
                <div style="margin-top:12px">
                  ${roundMatches.map((m) => {
                    const rep = (r) => r == null ? '<span style="color:#5a6270">—</span>' : r ? `<b style="color:var(--green)">reportou</b>` : '';
                    return `
                    <div class="org-match-row ${m.status === 'CONFLICT' ? 'conflict' : ''} ${m.status === 'DONE' ? 'done' : ''}">
                      <a style="font:800 15px var(--display);color:var(--yellow);text-decoration:none" href="/mesa/${t.slug}/${m.id}" title="Abrir tela de mesa">M${m.tableNo}</a>
                      <div style="font-size:12px">
                        <b>${BX.esc(m.p1?.user.name || '?')}</b> ${m.p1Reported ? '✓' : ''} vs <b>${BX.esc(m.p2?.user.name || 'BYE')}</b> ${m.p2Reported ? '✓' : ''}
                        <small style="display:block;color:var(--muted)">${m.status === 'DONE' ? `✔ vencedor: ${BX.esc((m.winnerId === m.p1?.id ? m.p1 : m.p2)?.user.name || '?')}${m.resolvedBy === 'ORGANIZER' ? ' (manual)' : ''}` : m.status === 'CONFLICT' ? '⚠ conflito — escolha o vencedor' : 'aguardando reportes'}</small>
                      </div>
                      <div class="row-actions">
                        ${m.status !== 'DONE' && !m.bye ? `
                          ${m.status !== 'CONFLICT' && (m.p1Reported || m.p2Reported) ? `<button class="btn secondary" data-accept="${m.id}">Aceitar reporte único</button>` : ''}
                          <button class="btn secondary" data-win="${m.id}:${m.p1?.id}">🏆 ${BX.esc(m.p1?.user.name || '')}</button>
                          <button class="btn secondary" data-win="${m.id}:${m.p2?.id}">🏆 ${BX.esc(m.p2?.user.name || '')}</button>` : ''}
                        ${m.status === 'DONE' && !m.bye ? `<button class="btn ghost" data-reopen="${m.id}">Reabrir</button>` : ''}
                        ${!m.bye ? `<button class="btn ghost" data-mesa="${m.id}" title="Abrir a tela de mesa desta partida no dispositivo da mesa (reporta pelos dois lados)">📺 Mesa</button>` : ''}
                      </div>
                    </div>`;
                  }).join('') || '<div class="empty-state">Nenhuma partida nesta rodada.</div>'}
                </div>
              </div>` : ''}
              <div class="panel-card">
                <p class="eyebrow">JOGADORES</p>
                <div style="margin-top:10px">${data.players.map((p) => `
                  <div class="org-match-row">
                    ${BX.avatarHtml(p.user, { size: 34 })}
                    <div style="font-size:12px"><b>${BX.esc(p.user.name)}</b>${p.dropped ? ' <small style="color:var(--muted)">(removido/drop)</small>' : ''}</div>
                    ${!p.dropped ? `<button class="btn danger-outline" data-kick="${p.id}">Remover</button>` : '<span></span>'}
                  </div>`).join('')}</div>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:16px">
              <div class="panel-card">
                <p class="eyebrow">DIVULGAÇÃO</p>
                <div class="qr-box" style="margin:12px 0"><img src="/api/tournaments/${t.slug}/qr.svg" alt="QR Code de inscrição"></div>
                <div class="share-grid">
                  <button class="btn secondary" id="copyLink">🔗 Copiar link de inscrição</button>
                  <a class="btn secondary" style="text-decoration:none;text-align:center" href="/torneio/${t.slug}/cartaz" target="_blank">🖨 Cartaz para impressão</a>
                  <a class="btn secondary" style="text-decoration:none;text-align:center;background:#173a24;border-color:#1faa53" href="${BX.esc(t.whatsappShareUrl)}" target="_blank" rel="noopener">💬 Compartilhar no WhatsApp</a>
                  <a class="btn secondary" style="text-decoration:none;text-align:center" href="/api/tournaments/${t.slug}/qr.svg" download="qr-${t.slug}.svg">⬇ Baixar QR Code</a>
                </div>
              </div>
              <div class="panel-card form-grid">
                <p class="eyebrow" style="margin:0">EDITAR TORNEIO</p>
                <div><label>Nome</label><input id="eName" value="${BX.esc(t.name)}" /></div>
                <div><label>Loja</label><input id="eStore" value="${BX.esc(t.storeName || '')}" /></div>
                <div><label>Endereço</label><input id="eAddr" value="${BX.esc(t.address || '')}" /></div>
                <div><label>Rodadas</label><input id="eRounds" type="number" min="1" max="12" value="${t.roundsPlanned}" /></div>
                <div><label>Descrição</label><textarea id="eDesc">${BX.esc(t.description || '')}</textarea></div>
                <div class="inline-actions"><button class="btn primary" id="saveT">Salvar</button></div>
              </div>
            </div>
          </div>`;

        const act = (fn) => async () => { try { await fn(); load(); } catch (e) { BX.toast(e.message); } };
        document.getElementById('startBtn')?.addEventListener('click', act(() => BX.api(`/api/tournaments/${slug}/start`, { method: 'POST' })));
        document.getElementById('nextBtn')?.addEventListener('click', act(() => BX.api(`/api/tournaments/${slug}/next-round`, { method: 'POST' })));
        document.getElementById('finishBtn')?.addEventListener('click', act(() => confirm('Encerrar o torneio?') && BX.api(`/api/tournaments/${slug}/finish`, { method: 'POST' })));
        document.getElementById('cancelBtn')?.addEventListener('click', act(() => confirm('Cancelar o torneio? Os jogadores serão avisados pelo status.') && BX.api(`/api/tournaments/${slug}/cancel`, { method: 'POST' })));
        box.querySelectorAll('[data-accept]').forEach((b) => b.addEventListener('click', act(() => BX.api(`/api/tournaments/${slug}/matches/${b.dataset.accept}/resolve`, { method: 'POST', body: {} }))));
        box.querySelectorAll('[data-win]').forEach((b) => b.addEventListener('click', act(() => {
          const [matchId, winnerId] = b.dataset.win.split(':');
          return BX.api(`/api/tournaments/${slug}/matches/${matchId}/resolve`, { method: 'POST', body: { winnerId } });
        })));
        box.querySelectorAll('[data-reopen]').forEach((b) => b.addEventListener('click', act(() => BX.api(`/api/tournaments/${slug}/matches/${b.dataset.reopen}/reopen`, { method: 'POST' }))));
        box.querySelectorAll('[data-mesa]').forEach((b) => b.addEventListener('click', async () => {
          try {
            const { url } = await BX.api(`/api/tournaments/${slug}/matches/${b.dataset.mesa}/table-token`, { method: 'POST' });
            const w = window.open(url, '_blank'); if (!w) location.href = url;
          } catch (e) { BX.toast(e.message); }
        }));
        box.querySelectorAll('[data-kick]').forEach((b) => b.addEventListener('click', act(() => confirm('Remover este jogador?') && BX.api(`/api/tournaments/${slug}/players/${b.dataset.kick}`, { method: 'DELETE' }))));
        document.getElementById('copyLink')?.addEventListener('click', async () => {
          await navigator.clipboard.writeText(t.joinUrl);
          BX.toast('Link copiado!');
        });
        document.getElementById('saveT')?.addEventListener('click', act(() => BX.api(`/api/tournaments/${slug}`, {
          method: 'PATCH',
          body: {
            name: document.getElementById('eName').value,
            storeName: document.getElementById('eStore').value,
            address: document.getElementById('eAddr').value,
            roundsPlanned: document.getElementById('eRounds').value,
            description: document.getElementById('eDesc').value,
          },
        })));
      }

      await load();
      // Atualiza sozinho a cada 20s enquanto o torneio roda (uma chamada; só redesenha se algo mudou)
      pollTimer = setInterval(async () => {
        if (document.hidden) return;
        const data = await BX.api(`/api/tournaments/${encodeURIComponent(slug)}`).catch(() => null);
        if (!data) return;
        if (data.tournament.status === 'RUNNING' || data.tournament.status !== last?.data?.tournament?.status) load(data);
      }, 20_000);
      window.addEventListener('pagehide', () => clearInterval(pollTimer));
      document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
    })();
  </script>
</body>
</html>
