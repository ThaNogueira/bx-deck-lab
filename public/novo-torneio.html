<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar torneio — BX Deck Lab</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/design-system.css"><style>.create-tournament{max-width:760px;margin:30px auto;padding:0 16px}.create-head{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:20px}.create-card{padding:clamp(18px,4vw,32px);border:1px solid var(--line);border-radius:20px;background:#12161d}.create-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.create-grid .wide{grid-column:1/-1}.cover-preview{aspect-ratio:16/6;border:1px dashed #46505e;border-radius:14px;display:grid;place-items:center;overflow:hidden;color:var(--muted);background:#0d1117}.cover-preview img{width:100%;height:100%;object-fit:contain}.form-foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px}@media(max-width:620px){.create-tournament{margin:14px auto}.create-grid{grid-template-columns:1fr}.create-grid .wide{grid-column:auto}.cover-preview{aspect-ratio:1}.form-foot{flex-direction:column-reverse}.form-foot .btn{width:100%}}</style></head><body><div class="noise"></div><header id="topbar"></header><main class="create-tournament"><div class="create-head"><div><p class="eyebrow">NOVO EVENTO</p><h1>Criar torneio</h1><p class="muted">Preencha o essencial agora; você poderá editar tudo depois.</p></div><a class="btn ghost" href="/torneios">Cancelar</a></div><form class="create-card" id="form"><div class="create-grid"><div class="wide"><label>Nome do torneio<input id="name" required maxlength="80" placeholder="Ex.: X Clash — Edição 4"></label></div><div><label>Loja<select id="store" required></select></label></div><div><label>Data e horário<input id="date" type="datetime-local" required></label></div><div class="wide"><label>Endereço<input id="address" readonly placeholder="Preenchido automaticamente pela loja"></label></div><div><label>Formato<select id="format"><option value="MD3">Melhor de 3</option><option value="POINTS4">Partida única até 4 pontos</option></select></label></div><div><label>Rodadas<input id="rounds" type="number" min="1" max="12" value="4"></label></div><div><label>Inscrição (R$)<input id="fee" type="number" min="0" step="0.01" value="0" inputmode="decimal"><small class="muted">Use 0 para gratuito.</small></label></div><div class="wide"><label>Descrição<textarea id="description" maxlength="2000" placeholder="Regras, premiação e informações importantes…"></textarea></label></div><div class="wide"><label>Capa do torneio <small class="muted">opcional</small><input id="cover" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="cover-preview" id="preview">A imagem aparece inteira no desktop e em destaque no celular.</div></div></div><div class="form-foot"><a class="btn ghost" href="/torneios">Voltar</a><button class="btn primary" id="submit">Criar torneio</button></div></form></main><script src="/js/shared.js"></script><script>BX.renderTopbar('/torneios');const $=id=>document.getElementById(id);let stores=[];BX.api('/api/stores').then(x=>{stores=x.stores;$('store').innerHTML=stores.map(s=>`<option value="${BX.esc(s.id)}">${BX.esc(s.name)}</option>`).join('')||'<option value="">Nenhuma loja ativa</option>';setAddress()}).catch(()=>{$('store').innerHTML='<option value="">Não foi possível carregar as lojas</option>';});function setAddress(){const s=stores.find(x=>x.id===$('store').value);$('address').value=s?.address||''}$('store').onchange=setAddress;$('cover').onchange=e=>{const f=e.target.files[0];if(f)$('preview').innerHTML=`<img src="${URL.createObjectURL(f)}" alt="Prévia da capa">`};$('form').onsubmit=async e=>{e.preventDefault();try{if(!$('store').value)throw new Error('Não há loja ativa disponível.');const r=await BX.api('/api/tournaments',{method:'POST',body:{name:$('name').value,storeId:$('store').value,startsAt:$('date').value,format:$('format').value,roundsPlanned:$('rounds').value,entryFeeCents:Math.round(+$('fee').value*100),description:$('description').value}});const f=$('cover').files[0];if(f){const data=new FormData();data.append('file',f);await BX.api(`/api/tournaments/${r.tournament.slug}/cover`,{method:'POST',body:data})}location.href=`/torneio/${r.tournament.slug}`}catch(err){BX.toast(err.message)}};</script></body></html>
