<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#090a0f" />
  <title>Ranking de jogadores — BX Deck Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css" /><link rel="stylesheet" href="/design-system.css" />
</head>
<body>
  <div class="noise"></div><header id="topbar"></header>
  <main>
    <section class="hero compact ranking-hero">
      <div><p class="eyebrow">CIRCUITO BX DECK LAB</p><h1>Ranking de <em>jogadores</em></h1><p>Resultados de torneios concluídos, pódios e as Beys que cada jogador leva para a arena.</p></div>
      <div class="ranking-totals" id="rankingTotals"><span class="sk sk-line w60"></span></div>
    </section>
    <section class="ranking-section">
      <div class="section-title-row ranking-title"><div><p class="eyebrow">CLASSIFICAÇÃO GERAL</p><h2>Quem está no topo</h2></div><label class="ranking-search"><span aria-hidden="true"></span><input id="rankingSearch" type="search" placeholder="Buscar jogador…" autocomplete="off"></label></div>
      <div class="ranking-order"><label for="rankingOrder">Ordenar por</label><select id="rankingOrder"><option value="elo">Elo competitivo</option><option value="circuit">Pontos do circuito</option></select><a href="/elos">Como funcionam os elos ↗</a></div>
      <div class="ranking-table" id="rankingTable"><div class="empty-state">Carregando ranking…</div></div>
    </section>
  </main>
  <script src="/js/shared.js"></script>
  <script>
    (async () => {
      BX.renderTopbar('/ranking');
      const esc = BX.esc;
      const medal = (kind, n, label) => `<span class="ranking-medal ${kind}" title="${label}"><b>${n}</b><small>${label}</small></span>`;
      const render = (data, query = '') => {
        const q = query.trim().toLocaleLowerCase('pt-BR');
        const byElo = document.getElementById('rankingOrder').value === 'elo';
        const sorted = [...data.ranking].sort((a,b) => byElo ? Number(a.rating.provisional)-Number(b.rating.provisional) || b.rating.points-a.rating.points || b.points-a.points : b.points-a.points || b.gold-a.gold || b.wins-a.wins);
        const rows = sorted.map((r, index) => ({ ...r, position: index + 1 })).filter((r) => !q || r.user.name.toLocaleLowerCase('pt-BR').includes(q) || r.user.slug.toLocaleLowerCase('pt-BR').includes(q));
        document.getElementById('rankingTable').innerHTML = rows.length ? rows.map((r) => `<a class="ranking-row" href="/u/${esc(r.user.slug)}"><b class="ranking-place ${r.position < 4 ? 'podium p' + r.position : ''}">${r.position}</b>${BX.avatarHtml({ ...r.user, rating: r.rating }, { size: 42 })}<span class="ranking-player"><strong>${esc(r.user.name)}</strong>${BX.rankBadge(r.rating)}<small>${r.events} torneio${r.events === 1 ? '' : 's'} · ${r.wins} vitória${r.wins === 1 ? '' : 's'} · ${r.losses} derrota${r.losses === 1 ? '' : 's'}</small>${r.favoriteBeys?.length ? `<span class="ranking-deck-preview" title="Três Beys mais usadas nos torneios">${BX.deckPreview(r.favoriteBeys.map((bey) => bey.ids), { u: 24, parts: data.parts })}</span>` : ''}</span><span class="ranking-medals">${medal('gold', r.gold, 'ouro')}${medal('silver', r.silver, 'prata')}${medal('bronze', r.bronze, 'bronze')}</span><strong class="ranking-points">${byElo ? r.rating.points : r.points}<small>${byElo ? (r.rating.provisional ? 'provisório' : 'Elo') : 'circuito'}</small></strong></a>`).join('') : '<div class="empty-state">Nenhum jogador encontrado.</div>';
      };
      try {
        const data = await BX.api('/api/ranking');
        document.getElementById('rankingTotals').innerHTML = `<b>${data.totals.tournaments}</b><span>torneios concluídos</span><b>${data.totals.players}</b><span>jogadores</span><b>${data.totals.matches}</b><span>partidas</span>`;
        render(data);
        document.getElementById('rankingOrder').addEventListener('change', () => render(data, document.getElementById('rankingSearch').value));
        document.getElementById('rankingSearch').addEventListener('input', (e) => render(data, e.target.value));
      } catch (e) { document.getElementById('rankingTable').innerHTML = `<div class="empty-state">${esc(e.message)}</div>`; }
    })();
  </script>
</body>
</html>
