<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Em manutenção — BX Deck Lab</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="noise"></div>
  <main>
    <div class="center-page">
      <div class="panel-card">
        <div class="brand" style="justify-content:center;margin-bottom:18px">
          <div class="brand-mark" aria-hidden="true"><span>X</span></div>
        </div>
        <p class="eyebrow">MANUTENÇÃO</p>
        <h1 style="font:800 44px var(--display);text-transform:uppercase;margin:4px 0 10px">Já <em style="color:var(--red)">voltamos</em>!</h1>
        <p id="msg" style="color:var(--muted);font-size:13px;line-height:1.7">O site está em manutenção rápida. Tente de novo em alguns minutos.</p>
        <button class="btn secondary" style="margin-top:14px" onclick="location.href='/'">Tentar de novo</button>
        <p style="margin-top:16px"><a href="/entrar" style="color:#626976;font-size:10px">Sou admin — entrar</a></p>
      </div>
    </div>
  </main>
  <script src="/js/shared.js"></script>
  <script>
    BX.site().then((s) => {
      if (!s.maintenance?.on) { location.href = '/'; return; }
      if (s.maintenance.message) document.getElementById('msg').textContent = s.maintenance.message;
    }).catch(() => {});
  </script>
</body>
</html>
